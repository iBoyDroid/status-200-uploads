# Checks both packages on every push to main and every pull request. It publishes nothing and holds
# no secret: releases are publish-n8n.yml and publish-python.yml (see RELEASING.md).
#
# Actions are pinned to full commit SHAs (the version is in the comment); Dependabot proposes updates.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n8n:
    name: n8n node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: n8n/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (n8n's rules for community nodes)
        run: npm run lint

      - name: Eligible for n8n Cloud (strict mode and n8n's default lint rules)
        env:
          NO_COLOR: '1'
        run: |
          npx --no-install n8n-node cloud-support | tee "$RUNNER_TEMP/cloud-support.txt"
          grep -q "Cloud support is ENABLED" "$RUNNER_TEMP/cloud-support.txt"

      - name: Formatting (Prettier)
        run: npx --no-install prettier --check credentials nodes test

      - name: Types
        run: npm run typecheck

      - name: Tests (unit, contract with openapi/openapi.yaml, templates)
        run: npm test

      - name: Build
        run: npm run build

      - name: What the npm package holds
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node ../scripts/check-n8n-pack.mjs "$RUNNER_TEMP/pack.json"

  python-client:
    name: Python client matches openapi.yaml; lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # openapi-python-client 0.29.1 needs Python 3.11 or later.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/tools/requirements.txt

      - name: Install the pinned generator and ruff
        run: python -m pip install -r python/tools/requirements.txt

      - name: Lint and formatting (ruff, with python/pyproject.toml's settings)
        working-directory: python
        run: |
          ruff check .
          ruff format --check .

      - name: Generate the client again from openapi/openapi.yaml
        run: bash scripts/regenerate-python.sh

      - name: The committed client is exactly what the generator writes
        run: |
          changes="$(git status --porcelain -- python/src)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff --stat -- python/src
            echo "::error::python/src/status200uploads/_generated differs from what openapi/openapi.yaml gives. Run scripts/regenerate-python.sh and commit the result."
            exit 1
          fi

      - name: Type check the hand-written layer (mypy, with python/pyproject.toml's settings)
        working-directory: python
        run: |
          python -m pip install -e . mypy==2.3.1
          mypy

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install the package and its test tools
        run: python -m pip install -e ".[test]"

      - name: Tests (the live tests are skipped; CI has no API key)
        run: python -m pytest

      - name: Build the package and check it
        run: |
          python -m pip install -r tools/build-requirements.txt
          python -m build --outdir "$RUNNER_TEMP/dist" .
          python -m twine check --strict "$RUNNER_TEMP"/dist/*

      - name: The wheel installs and imports on its own
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import status200uploads as s; print('status200uploads', s.__version__); s.Status200"
