# Publishes the n8n node (folder n8n/) to npm as @status200uploads/n8n-nodes-status200uploads when a tag
# n8n-vX.Y.Z is pushed. The steps for a release are in RELEASING.md.
#
# 1. check: runs every check CI runs, on the tagged commit, and packs the package once. It holds no
#    credential and cannot publish.
# 2. publish: waits for the maintainer's approval (GitHub environment "npm"), then publishes that same
#    tarball with a provenance statement. It installs nothing and runs no package script, so no
#    dependency's code runs where the publish credentials are.
#    Credentials: npm trusted publishing (OIDC), set up on npmjs.com for this repository, this file
#    (publish-n8n.yml) and the environment "npm". The first release, before the package exists on npm
#    and trusted publishing can be set up, uses the environment secret NPM_TOKEN instead; after that the
#    secret is deleted and this job publishes without it.
# 3. scan: runs n8n's security scanner on the published version, as n8n's review does. The scanner
#    exits 0 even when a package fails, so its verdict is read from what it prints.
#
# The file name and the environment name are part of the trusted publisher setting on npmjs.com:
# renaming either stops publishing until that setting is changed too.

name: Publish n8n node

on:
  push:
    tags:
      - 'n8n-v*.*.*'

permissions: {}

concurrency:
  group: publish-n8n
  cancel-in-progress: false

env:
  PACKAGE_NAME: '@status200uploads/n8n-nodes-status200uploads'

jobs:
  check:
    name: Check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag names n8n/package.json's version, on a commit of main
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "n8n-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but n8n/package.json says $version: tag n8n-v$version instead."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main. Release only commits that are on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Lint (n8n's rules for community nodes)
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          node ../scripts/check-n8n-pack.mjs "$RUNNER_TEMP/pack.json"
          tarball="$(node -p "require(process.argv[1])[0].filename" "$RUNNER_TEMP/pack.json")"
          sha256sum "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n8n-package
          path: n8n/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # For npm trusted publishing and for the provenance statement.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: n8n-package
          path: package

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: npm can use trusted publishing (npm 11.5.1 or later)
        run: |
          echo "npm $(npm --version)"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"

      - name: Publish with provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The leading ./ is required: npm reads "package/<file>.tgz" (two words and a slash) as a GitHub
          # repository shorthand and tries git@github.com:package/... instead of the local file (the first
          # release attempt on 2026-09-29 failed that way, before anything was published).
          TARBALL: ./package/${{ needs.check.outputs.tarball }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sha256sum "$TARBALL"
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the environment secret NPM_TOKEN (first release only; delete it once trusted publishing is set up)."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret: publishing through npm trusted publishing (OIDC)."
          fi
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          npm publish "$TARBALL" --provenance --access public --tag "$dist_tag"

  scan:
    name: n8n security scan of the published version
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # The scanner reads the package from the registry, which can answer 404 for several minutes after a
      # publish (the first release on 2026-09-29 was still 404 five minutes later). A 404 is waited out;
      # any other failure is the scan's verdict and stops the job at once.
      - name: Scan with @n8n/scan-community-package (retried while the registry catches up)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            npx --yes @n8n/scan-community-package "$PACKAGE_NAME@$VERSION" > "$RUNNER_TEMP/scan.txt" 2>&1 || true
            if grep -q "has passed all security checks" "$RUNNER_TEMP/scan.txt"; then
              grep -E "passed|✅" "$RUNNER_TEMP/scan.txt"
              exit 0
            fi
            if ! grep -q "status code 404" "$RUNNER_TEMP/scan.txt"; then
              cat "$RUNNER_TEMP/scan.txt"
              echo "::error::n8n's scanner did not pass $PACKAGE_NAME@$VERSION. The package is published; fix what the scan says and release a new version."
              exit 1
            fi
            echo "The registry does not serve $PACKAGE_NAME@$VERSION yet (attempt $attempt of 20); trying again in 30 seconds."
            sleep 30
          done
          echo "::error::The registry still did not serve $PACKAGE_NAME@$VERSION after 10 minutes, so it was not scanned. Run this job again later (Re-run failed jobs); nothing needs to be published again."
          exit 1
