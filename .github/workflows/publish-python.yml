# Publishes the Python package (folder python/) to PyPI as status200uploads when a tag python-vX.Y.Z is
# pushed. The steps for a release are in RELEASING.md.
#
# 1. build: runs the tests and the checks CI runs on the tagged commit, builds the sdist and the wheel
#    once, and keeps them. It holds no credential and cannot publish.
# 2. publish: waits for the maintainer's approval (GitHub environment "pypi"), then uploads those same
#    files with PyPI trusted publishing (no token, no password) and PEP 740 attestations.
#
# PyPI's trusted publisher is set for this repository, this file (publish-python.yml) and the
# environment "pypi": renaming either stops publishing until that setting is changed too.

name: Publish Python package

on:
  push:
    tags:
      - 'python-v*.*.*'

permissions: {}

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: The tag names python/pyproject.toml's version, on a commit of main
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "python-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but python/pyproject.toml says $version: tag python-v$version instead."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main. Release only commits that are on main."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install the package, its test tools and the pinned generator
        run: |
          python -m pip install -e ".[test]"
          python -m pip install -r tools/requirements.txt -r tools/build-requirements.txt

      - name: Tests (the live tests are skipped; there is no API key here)
        run: python -m pytest

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: The committed client is exactly what the generator writes from openapi.yaml
        working-directory: .
        run: |
          bash scripts/regenerate-python.sh
          if [ -n "$(git status --porcelain -- python/src)" ]; then
            git status --porcelain -- python/src
            echo "::error::python/src/status200uploads/_generated differs from what openapi/openapi.yaml gives."
            exit 1
          fi

      - name: Build and check
        run: |
          python -m build --outdir dist .
          python -m twine check --strict dist/*
          ls -l dist
          sha256sum dist/*

      - name: The wheel installs and imports on its own, with this version
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import sys, status200uploads as s; print(s.__version__); sys.exit(s.__version__ != '$VERSION')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/status200uploads
    permissions:
      # For PyPI trusted publishing and the attestations; nothing else.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
