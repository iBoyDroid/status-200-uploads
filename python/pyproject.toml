[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "status200uploads"
version = "0.1.0"
description = "Publish and schedule posts to TikTok, Instagram, Facebook, YouTube, X, LinkedIn, Pinterest, Threads and Skool with the Status 200 Uploads API."
readme = "README.md"
# The generated client (openapi-python-client 0.29.1) uses typing.Self, new in Python 3.11.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "iBoyDroid", email = "info@status200uploads.com" }]
maintainers = [{ name = "iBoyDroid", email = "info@status200uploads.com" }]
keywords = [
    "status200uploads",
    "social media",
    "scheduling",
    "tiktok",
    "instagram",
    "youtube",
    "linkedin",
    "pinterest",
    "api client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# The generated client's own requirements (openapi-python-client 0.29.1); the hand-written layer
# adds none.
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://status200uploads.com"
Documentation = "https://status200uploads.com/docs/api#guide-python"
Source = "https://github.com/iBoyDroid/status-200-uploads/tree/main/python"
Issues = "https://github.com/iBoyDroid/status-200-uploads/issues"
Changelog = "https://github.com/iBoyDroid/status-200-uploads/blob/main/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/status200uploads"]

[tool.hatch.build.targets.sdist]
# The tests read ../openapi/openapi.yaml, which is outside this folder, so they stay in the repository.
include = [
    "src/status200uploads",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
# The hand-written layer is checked (CI: .github/workflows/ci.yml); the generated code is not ours to
# edit, so its errors are ignored.
files = ["src/status200uploads"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["status200uploads._generated", "status200uploads._generated.*"]
ignore_errors = true

[tool.ruff]
# Also read by the generator's post hooks (python/openapi-python-client.yaml), so the generated code
# is formatted and fixed with the same settings: target 3.11 keeps typing.Self (not typing_extensions).
target-version = "py311"
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
extend-select = ["I", "UP"]
