    delete:
      operationId: cancelUpload
      tags: [Media]
      summary: Cancel an unfinished upload
      description: >-
        Closes an upload that is not ready: what arrived is deleted within a few minutes, and its
        slot among the 10 open uploads frees at once. Bytes that already arrived still count in
        today's budget. It works while making links is paused. A ready upload is a media library
        file: delete it there (409 upload_closed). Any API key of the account; no body.
      responses:
        '200':
          description: Cancelled.
