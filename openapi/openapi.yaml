openapi: 3.1.0
# Status 200 Uploads REST API: the OpenAPI 3.1 description of both addresses.
#
# House rules for this file (they keep generated clients working when the API grows):
#   - response codes, statuses and outcomes are plain strings with x-known-values, never enums: new
#     codes are added without notice;
#   - no additionalProperties: false anywhere: the API answers unknown request fields with warnings,
#     and answers may gain fields;
#   - oneOf only where a required field separates the variants;
#   - one spelling per request field (boardId, mediaID, dryRun); the aliases are named in descriptions;
#   - REST refusals carry code, message and (for a plan refusal) upgrade_url. There is no next_step and
#     no retry rule in them: those belong to the AI connector. What a client may resend is the table
#     components.x-status200-retry;
#   - two exceptions carry next_step, as the AI connector reads the same answers: the upload-link
#     endpoints (/media/uploads, with retry for most refusals) and a refused share link on POST /media
#     (with provider). The schemas leave next_step and retry out; the descriptions name them.
info:
  title: Status 200 Uploads API
  version: '2026-10-06'
  summary: Publish and schedule posts to TikTok, Instagram, Facebook, YouTube, X, LinkedIn, Pinterest, Threads and Skool.
  description: >-
    One request publishes (or schedules, with post.scheduledFor) one post to one network from one
    profile. Media is imported first (POST /media) or uploaded from a computer through a one-time
    upload link (POST /media/uploads, paid plans), and sent as its file_id; or it is sent as public
    URLs. The reads (GET /accounts, /accounts/{profile_id}/options, /posts, /posts/{id}, /media/files)
    and the upload links are on the main address only.


    Two addresses serve the same engine. The main address is https://status200uploads.com/api/v2
    and answers every request within about 25 seconds. The older address
    https://app.status200uploads.com/functions/v1 (the paths tagged "Older address", each with its
    own server) takes the same POST and DELETE, waits up to 90 seconds for media that is still
    importing, and says a few refusals in other codes; its differences are in each of its operations.


    Safe retries: a POST may carry an Idempotency-Key header; the same key with the same body within
    24 hours gets the first answer again with Idempotent-Replayed: true, and nothing is posted twice.
    Which answers a client may send again, and how, is the table components.x-status200-retry.
  contact:
    name: Status 200 Uploads
    email: info@status200uploads.com
    url: https://status200uploads.com/support
  termsOfService: https://status200uploads.com/terms
externalDocs:
  description: API documentation
  url: https://status200uploads.com/docs/api
servers:
  - url: https://status200uploads.com/api/v2
    description: The API.
security:
  - apiKey: []
tags:
  - name: Posts
    description: Publish, schedule, check (dry run), cancel and read posts.
  - name: Accounts
    description: Your profiles, their connected networks, and what each network allows.
  - name: Media
    description: Import an image or a video from a URL, or upload one from a computer through a one-time link, follow either, and list your media library.
  - name: Older address
    description: >-
      https://app.status200uploads.com/functions/v1: the same engine as /api/v2/posts and the same media
      handler as /api/v2/media, kept for the callers that use it. No reads here (a GET of api-posts is 405).
x-status200-unknown-path:
  status: 404
  code: not_found
  response: '#/components/responses/NotFound'

paths:
  /posts:
    description: >-
      POST publishes, schedules or checks a post; GET lists your posts. OPTIONS answers 200 with CORS
      only.
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/MethodNotAllowed'
      note: Any other method on /api/v2/posts (PUT, PATCH, DELETE without an id).
    post:
      operationId: createPost
      tags: [Posts]
      summary: Publish, schedule or check a post
      description: >-
        One post to one network. Without post.scheduledFor (or with a time within 60 seconds) it is
        published now; more than 60 seconds ahead (up to 365 days) it is scheduled and the answer is
        202 with code "scheduled". With dryRun true every check a publish makes is run and nothing is
        sent: the answer is 200 with dry_run true.


        Order of checks on this address: method, JSON, key, dryRun flag
        (a dry run is forwarded here), post, platform, YouTube tags, scheduledFor, Idempotency-Key,
        accountId, profile (403 or 400), media ids exist (404); then the engine: the X/Skool plan gate (403), the 20-second
        throttle (429), connection, media wait (about 12 seconds here, then 409), the media addresses
        (400 bad_request), pre-post guards, the scheduled branch (202), the allowance (429 monthly or
        202 queued), the send.


        Media is required except for text posts on X, LinkedIn, Threads, Skool and Facebook. Every
        answer arrives within about 25 seconds; a network slower than that is answered 202
        still_publishing. Every 2xx may carry warnings (fields that were not used) and, when a post or a
        scheduled post was recorded, status200.


        A network's own refusal keeps the network's own 4xx status: pinterest_rejected (Pinterest) and
        x_rejected (X) are listed under every status those networks answer with.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
            examples:
              instagramReel:
                summary: An Instagram Reel from an imported file
                value:
                  post:
                    accountId: '@myprofile'
                    platform: instagram
                    content:
                      text: 'Check out this reel! #trending'
                      mediaID: [a1b2c3d4-e5f6-7890-abcd-ef1234567890]
                    instagram:
                      postType: reel
                      shareToFeed: true
              scheduledTikTok:
                summary: A TikTok video scheduled for later
                value:
                  post:
                    accountId: '@myprofile'
                    platform: tiktok
                    scheduledFor: '2026-10-01T09:00:00Z'
                    content:
                      text: Coming Thursday
                      mediaID: [a1b2c3d4-e5f6-7890-abcd-ef1234567890]
                    tiktok:
                      privacyLevel: PUBLIC_TO_EVERYONE
              linkedinText:
                summary: A LinkedIn text post
                value:
                  post:
                    accountId: d4e5f6a7-b8c9-0123-def0-234567890123
                    platform: linkedin
                    content:
                      text: Hello from the API
              dryRun:
                summary: Check a Pinterest pin without sending it
                value:
                  dryRun: true
                  post:
                    accountId: '@myprofile'
                    platform: pinterest
                    content:
                      text: Recipe of the week
                      mediaUrls: ['https://example.com/pin.jpg']
                    pinterest:
                      boardId: '900123'
      responses:
        '200':
          $ref: '#/components/responses/Published'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          description: >-
            The request cannot be sent as it is. Nothing was sent. A media address that is not a web
            address (a value of post.content.mediaUrls, or a Reel's post.instagram.coverUrl, that a URL
            parser does not read as an http:// or https:// address) is bad_request with error.field
            naming it, and no post is recorded. Every item of content.mediaUrls is checked, even one the
            network would not use. api_error for a network that is not connected (an Instagram, Facebook or Threads
            connection with status expired is the 401 below).
          x-error-codes: [bad_request, api_error, scheduled_for_invalid, youtube_tags_too_long, idempotency_key_invalid, profile_name_ambiguous, pinterest_board_required, media_wrong_for_post_type, options_outside_post, media_not_available, video_size_unknown, no_container, no_publish_id, pinterest_sandbox_board, pinterest_rejected, x_rejected, skool_rejected, category_required]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            unauthorized: no key, or a key that is not active. A network that no longer accepts the
            profile's sign-in answers 401 with its own code: reconnect_required (Facebook, LinkedIn,
            Skool, Threads), RECONNECT_REQUIRED (Instagram), REFRESH_TOKEN_EXPIRED (TikTok), NO_TOKEN (Instagram,
            TikTok), pinterest_auth_failed, x_rejected: reconnect it on the Connections page.
            An Instagram, Facebook or Threads connection with status expired (health reconnect_required in GET
            /api/v2/accounts) is refused this way before anything is sent, with error.platform and a message that
            says to reconnect it; a Meta connection also turns expired when Meta refuses its sign-in on a post, a
            read or a renewal and again on our own check, and the message then says why.
            TOKEN_REFRESH_FAILED (Instagram, TikTok, Threads): the sign-in could not be renewed just now; try again
            later, and reconnect the network if it keeps failing.
          x-error-codes: [unauthorized, reconnect_required, RECONNECT_REQUIRED, REFRESH_TOKEN_EXPIRED, NO_TOKEN, TOKEN_REFRESH_FAILED, pinterest_auth_failed, x_rejected]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            account_not_found (error.profiles lists yours), plan_required (Skool needs Beginner or
            higher, X needs the X add-on; error.required, error.platform, error.upgrade_url), or the
            network's own refusal.
          x-error-codes: [account_not_found, plan_required, pinterest_rejected, x_rejected, forbidden]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            A mediaID that does not exist on your account (answered at once, error.file_id): never
            imported or uploaded, deleted, removed after 7 days, or an upload link's file that is not
            ready yet (POST /media/uploads/{file_id}/complete first); otherwise import it again (POST
            /media) or upload it again from the computer (POST /media/uploads, paid plans). Or the
            network's own 404 (for example a Pinterest boardId that does not exist).
          x-error-codes: [media_not_found, pinterest_rejected, x_rejected]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            media_processing (a mediaID still importing after about 12 seconds; Retry-After 30),
            scheduled_queue_full (500 posts already waiting), idempotency_in_progress (Retry-After 5),
            idempotency_outcome_unknown, or the network's own 409.
          x-error-codes: [media_processing, scheduled_queue_full, idempotency_in_progress, idempotency_outcome_unknown, pinterest_rejected, x_rejected]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The file is larger than the chosen network accepts. Nothing was sent to it.
          x-error-codes: [MEDIA_TOO_LARGE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            media_failed (the mediaID's import failed), idempotency_key_reused (the key was used for
            another body), a TikTok photo that cannot be sent as JPEG or made smaller to TikTok's 1080 x 1920, or the network's own 422.
            A TikTok photo refusal names the photo in error.photo (counting from 1) and is answered before
            anything is sent; the limits and the messages are at https://status200uploads.com/docs/api#tiktok-photos.
          x-error-codes: [media_failed, idempotency_key_reused, photo_format_not_supported, photo_too_large_to_convert, photo_too_large_to_resize, photo_conversion_failed, pinterest_rejected, x_rejected]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/PostsTooManyRequests'
        '500':
          description: >-
            server_error: our side failed (read the message; with an Idempotency-Key an answer whose
            outcome is not known is replayed). platform_error: a network's 5xx that named no code; a
            LinkedIn refusal (for example a duplicate post) arrives this way too, with LinkedIn's reason
            in the message, and is kept under an Idempotency-Key. api_error: the post could not be
            queued for the next day.
          x-error-codes: [server_error, platform_error, api_error]
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            upstream_unavailable: the request never left, nothing was posted. upload_worker_failed: our
            upload of a TikTok video stopped. platform_error: a gateway's 502 without a code of its own.
          x-error-codes: [upstream_unavailable, upload_worker_failed, platform_error]
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/PostsUnavailable'
        default:
          $ref: '#/components/responses/Default'
    get:
      operationId: listPosts
      tags: [Posts]
      summary: List your posts and waiting posts
      description: >-
        Newest first by `at` (when a post was sent, when a scheduled post is due). A scheduled post is
        listed until it has produced posts; then each network's post is listed instead, with its
        scheduled_post_id. 60 reads a minute per account (all its keys together). Not counted in the
        key's request count, and a 200 is not logged.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PlatformFilter'
        - $ref: '#/components/parameters/KindFilter'
        - $ref: '#/components/parameters/ProfileIdFilter'
      responses:
        '200':
          description: One page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '400':
          $ref: '#/components/responses/ReadBadRequest'
        '401':
          $ref: '#/components/responses/ReadUnauthorized'
        '429':
          $ref: '#/components/responses/ReadTooManyRequests'
        '500':
          $ref: '#/components/responses/ReadServerError'
        default:
          $ref: '#/components/responses/Default'

  /posts/{id}:
    description: >-
      One post or scheduled post. Any method other than GET and DELETE, and any deeper path, is the JSON
      404 not_found.
    x-status200-other-methods:
      status: 404
      code: not_found
      response: '#/components/responses/NotFound'
      note: Any method other than GET and DELETE, and any path deeper than one id.
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getPost
      tags: [Posts]
      summary: Read one post or scheduled post
      description: >-
        The id is status200.post_id or status200.scheduled_post_id of a POST answer (its
        status200.status_url is this address), or an id from GET /posts. To wait for a post, read it
        every 30 seconds until done is true, for up to 10 minutes. Another account's id is answered
        exactly like an id that does not exist. A post, and each network's result of a scheduled
        post, carries notices: what we changed to get a TikTok photo post out (for example
        resized_for_tiktok, a photo sent as a smaller copy), kept when TikTok took the post, so a
        post sent by a schedule says it too; on the other networks only moved_to_next_day (another
        network of the same scheduled post moved to the next day as a scheduled post of its own,
        which its scheduled_post_id names).
      responses:
        '200':
          description: A post (with figures) or a scheduled post (with results).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRead'
        '400':
          $ref: '#/components/responses/ReadBadRequest'
        '401':
          $ref: '#/components/responses/ReadUnauthorized'
        '404':
          description: No post or scheduled post with that id on your account.
          x-error-codes: [post_not_found]
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/ReadTooManyRequests'
        '500':
          $ref: '#/components/responses/ReadServerError'
        default:
          $ref: '#/components/responses/Default'
    delete:
      operationId: cancelScheduledPost
      tags: [Posts]
      summary: Cancel a post that has not gone out
      description: >-
        The id is a scheduled_post_id (from a 202 scheduled or queued answer, or any waiting post of
        yours: API, dashboard, AI connector or the next-day queue). No body. Cancelling twice is safe:
        the second answer is 200 with already_cancelled true. The key is checked first (401), then the
        id (400), then the engine cancels it.
        The Idempotency-Key header is ignored.
      responses:
        '200':
          description: Cancelled (or already cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '400':
          description: The id is not a UUID.
          x-error-codes: [bad_request]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No key, or a key that is not active.
          x-error-codes: [unauthorized]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No scheduled post with that id on your account.
          x-error-codes: [post_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            not_cancellable: it is being published, was published or failed (error.status says which),
            or it cannot be cancelled with an API key (error.status scheduled). Nothing changed.
          x-error-codes: [not_cancellable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The cancel could not be done just now. Send it again.
          x-error-codes: [server_error]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The request never reached the engine. Send it again.
          x-error-codes: [upstream_unavailable]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: No answer in time. Send the same DELETE again after Retry-After (5).
          x-error-codes: [cancel_unconfirmed]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Default'

  /accounts:
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/ReadMethodNotAllowed'
      note: Any method but GET (Allow GET, OPTIONS), answered before the key is read.
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List your profiles and their connected networks
      description: >-
        Up to 100 profiles, oldest first, each with its networks (sorted by name) and whether each can
        post now (health). No parameters: an unknown one is named in warnings and not used.
      responses:
        '200':
          description: Your profiles.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/ReadUnauthorized'
        '429':
          $ref: '#/components/responses/ReadTooManyRequests'
        '500':
          $ref: '#/components/responses/ReadServerError'
        default:
          $ref: '#/components/responses/Default'

  /accounts/{profile_id}/options:
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/ReadMethodNotAllowed'
      note: Any method but GET (Allow GET, OPTIONS), answered before the key is read.
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      operationId: getPostingOptions
      tags: [Accounts]
      summary: What a profile may do on each network
      description: >-
        Asked of the networks themselves with the profile's own sign-in: the TikTok privacy levels it
        accepts, Pinterest boards, Skool groups and labels, the Facebook Page, the Instagram publishing
        limit, YouTube's choices. One row per network, always 200 (a network that fails is a row).
        Answers are reused for 90 seconds, and the whole answer is ready within 20 seconds. Also 10 a
        minute per account, on top of the 60 reads.
      parameters:
        - $ref: '#/components/parameters/PlatformsFilter'
        - $ref: '#/components/parameters/SkoolGroupSlug'
      responses:
        '200':
          description: One row per network.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingOptions'
        '400':
          $ref: '#/components/responses/ReadBadRequest'
        '401':
          $ref: '#/components/responses/ReadUnauthorized'
        '404':
          description: No profile with that id on your account. No network was asked.
          x-error-codes: [account_not_found]
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/ReadTooManyRequests'
        '500':
          $ref: '#/components/responses/ReadServerError'
        default:
          $ref: '#/components/responses/Default'

  /media:
    description: >-
      POST imports a file from a URL; GET ?file_id= follows an import, or an upload link's file.
      Errors of this endpoint have the older shape {"error": "sentence"} (MediaError). OPTIONS
      answers 200 with CORS only.
    x-status200-other-methods:
      status: 405
      response: '#/components/responses/MediaMethodNotAllowed'
      note: Any method but GET and POST.
    post:
      operationId: importMedia
      tags: [Media]
      summary: Import an image or a video from a URL
      description: >-
        Images up to 20 MB, videos up to 5 GB, of the types the media library takes: JPEG, PNG and
        WebP images, MP4 (M4V too), MOV and WebM videos. The source is probed first: a HEAD, then a
        ranged GET of one byte, or of the first 4 KB when the server sends no type or a generic one
        such as application/octet-stream (or when the HEAD fails), 8 seconds each, so up to about 16
        seconds. A file without a usable type is judged by those first bytes. The request
        waits up to about 22 seconds for the import: 200 ready, otherwise 202 processing (at once
        when the declared size cannot finish in time). One import every 20 seconds per account.
        Files are kept for 7 days, and until a scheduled post that uses them goes out. A file on a
        computer, not at a URL: POST /media/uploads.


        Share links (on for every account since 9 October 2026): a Google Drive, Dropbox, OneDrive
        or SharePoint link of a file shared with "Anyone with the link" is turned into the address of
        the file itself and imported like any URL, under the name the provider gives the file, on the
        paid plans.
        A file the provider gives no name is saved as file.<ext> (for example file.mp4), and a Dropbox
        file without one under the file name in its link.
        A link that cannot give one file is refused before anything is imported (400 with its own code,
        next_step and provider), and so is a link that needs converting sent with a Free key (403
        plan_limit_reached); a link that already downloads the file (a drive.usercontent.google.com
        link, a Google Drive uc link with export=download, a OneDrive or SharePoint
        download.aspx?share= link) is imported on every plan, with a Free key exactly as before. A
        refusal decided from the link or the plan does not start the 20-second wait.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaImportRequest'
      responses:
        '200':
          description: The import finished while the request was open.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaImportReady'
        '202':
          description: The import continues in the background. Poll GET /media?file_id= until status is ready.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaImportStarted'
        '400':
          description: >-
            Invalid JSON body, URL is required, a URL that is blocked or not http(s), the file could not
            be downloaded ("Failed to download file: ...", also when the server compresses the first
            bytes it was asked for), or idempotency_key_invalid. A share link
            that cannot give one file, with next_step and provider: link_not_public (not shared with
            "Anyone with the link", or a Dropbox link without its rlkey part), link_is_folder,
            link_not_found, link_temporarily_blocked (the provider's own download limit, usually about 24
            hours), link_not_a_file (an album, a document, a page), link_not_supported (an older or
            unknown kind of link, iCloud Drive) or share_links_paused (that provider's links are paused:
            link the file itself). Sent again unchanged, none of them can succeed.
          x-error-codes: [idempotency_key_invalid, link_not_public, link_is_folder, link_not_found, link_temporarily_blocked, link_not_a_file, link_not_supported, share_links_paused]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '401':
          description: Missing or invalid Authorization header, or a key that is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '403':
          description: >-
            plan_limit_reached: a share link that needs converting, sent with
            the key of a Free account (share links are included in the paid plans, from Beginner), with
            upgrade_url, next_step and provider. Nothing was imported, and the 20-second wait did not
            start.
          x-error-codes: [plan_limit_reached]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '409':
          description: The first import with this Idempotency-Key is still running (Retry-After 5), or never answered.
          x-error-codes: [idempotency_in_progress, idempotency_outcome_unknown]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '413':
          description: >-
            Image larger than 20 MB or video larger than 5 GB (error.size), or the storage refused the
            file after the import started (file_id, status "failed", size).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '415':
          description: >-
            The URL does not point to a file of a type the media library takes (JPEG, PNG, WebP, MP4,
            M4V, MOV, WebM): a web page, a GIF, HEIC or SVG image, another video format ("The URL
            points to a GIF file (Content-Type: image/gif), which Status 200 Uploads does not take
            ..."), or a source that sends no type or a generic one and whose first bytes are none of
            them (HEIC, AVIF and M4A included). Nothing is imported: convert the file first, or link
            the file itself. A shared file of another type names the file in file_name when the
            provider sends its name; the message of a URL that is a page
            adds that a share link works too on the paid plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '422':
          description: This Idempotency-Key was used in the last 24 hours for another body (first_used_at).
          x-error-codes: [idempotency_key_reused]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '429':
          description: >-
            rate_limited: less than 20 seconds since your previous import (Retry-After and
            retry_after_seconds). import_budget_exhausted (AI connector keys only): error is an object.
            That daily budget is shared with every upload link of the account (POST /media/uploads).
          x-error-codes: [rate_limited, import_budget_exhausted]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '500':
          description: The import could not be started, or it failed while the request was open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '503':
          description: >-
            idempotency_unavailable: the Idempotency-Key could not be checked (Retry-After 5).
            uploads_busy: the plan behind a share link that needs converting
            could not be read just then, with retry_after_seconds (Retry-After 60). Nothing was imported.
          x-error-codes: [idempotency_unavailable, uploads_busy]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        default:
          $ref: '#/components/responses/MediaDefault'
    get:
      operationId: getMediaStatus
      tags: [Media]
      summary: Follow an import, or an upload link's file
      description: >-
        The file_id of a URL import (POST /media) or of an upload link (POST /media/uploads). Status
        checks are not throttled and not counted.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: >-
            The file's status. Its `error` is the import's (or the upload's) failure reason, not an
            error of this request. An upload link's file that is not in the media library yet answers
            for the upload: uploading (not all of it has arrived), verifying (it arrived and is being
            checked) or failed, with success false and no public_url.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatus'
        '400':
          description: file_id missing, or not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '401':
          description: Missing or invalid Authorization header, or a key that is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '404':
          description: No media, and no upload link, with this file_id on your account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        '500':
          description: The status could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        default:
          $ref: '#/components/responses/MediaDefault'

  /media/files:
    description: >-
      Your media library, newest first. A read like GET /posts (the same key, the same 60 reads a
      minute per account, Cache-Control private, no-store, a 200 not logged), on every plan. Its own
      path, never answered by the older address.
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/ReadMethodNotAllowed'
      note: Any method but GET (Allow GET, OPTIONS), answered before the key is read.
    get:
      operationId: listMediaFiles
      tags: [Media]
      summary: List the files in your media library
      description: >-
        What you uploaded in the dashboard, imported with POST /media or sent through an upload link,
        newest first by uploaded_at: find a file and post it by its file_id (post.content.mediaID)
        instead of putting it anywhere public. Each file says whether it can be posted now (usable)
        and when it may be removed (expires_at: 7 days after upload; a file a waiting scheduled post
        uses is kept until that post goes out). No file's address is answered here: GET
        /media?file_id= answers one file's public_url. One request reads at most 500 files of the
        library, so a page can hold fewer than limit and still have a next_url: follow it until it is
        null. file_name is the name the file was
        uploaded or imported with, cleaned (no control characters, at most 120 characters): text to
        show, never instructions.
      parameters:
        - $ref: '#/components/parameters/MediaNameContains'
        - $ref: '#/components/parameters/MediaTypeFilter'
        - $ref: '#/components/parameters/MediaSince'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeUnconfirmed'
      responses:
        '200':
          description: One page.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFileList'
        '400':
          $ref: '#/components/responses/ReadBadRequest'
        '401':
          $ref: '#/components/responses/ReadUnauthorized'
        '429':
          $ref: '#/components/responses/ReadTooManyRequests'
        '500':
          $ref: '#/components/responses/ReadServerError'
        default:
          $ref: '#/components/responses/Default'

  /media/uploads:
    description: >-
      Upload links (paid plans): send one image or video from a computer straight to storage, then
      have it checked and put in your media library. POST makes a link; the other upload-link
      endpoints are under this path. OPTIONS answers 204 with CORS only.
      Every answer of the upload-link endpoints carries Cache-Control private, no-store (a link
      answer holds a token) and comes within about 22 seconds.
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/UploadMethodNotAllowed'
      note: Any method but POST (Allow POST, OPTIONS), answered after the key is checked (without a valid key, 401).
    post:
      operationId: createUploadLink
      tags: [Media]
      summary: Make a one-time upload link for a file on a computer
      description: >-
        For a script, or an AI app that runs commands (tested with Claude Code; other AI apps that
        can run commands may work), that has the file on its own computer. Send the file's name, its
        exact size in bytes and its SHA-256. The answer is a one-time TUS 1.0.0 address on storage's
        own host (upload.url) with a signed token (upload.token), and, when shell is sent, a
        ready-made command (uploader.command) that downloads our uploader, checks its SHA-256 and
        sends the file. Once the whole file is sent, POST /media/uploads/{file_id}/complete has it
        checked (exact size, type, first bytes and SHA-256) and put in the media library; the
        file_id then goes in post.content.mediaID like an imported file's. Nothing is public before
        that check.


        With your own TUS client: HEAD upload.url for its Upload-Offset, then PATCH pieces of
        exactly chunk_size bytes (6 MiB; the last one shorter) from that offset, each with
        x-signature (upload.token), Tus-Resumable 1.0.0, Upload-Offset and Content-Type
        application/offset+octet-stream; after a failed PATCH, HEAD again and go on from the offset
        it gives. The token works for this one file only, for about 2 hours (a fresh one: POST
        /media/uploads/{file_id}/token). A stopped upload can be continued until
        upload.resume_before; after that, what was sent is deleted. The same file (sha256 and size)
        asked for again from the same API key while its link is open gets the same address with a
        fresh token: 200 with renewed true, and nothing is reserved twice.


        Paid plans only: Free and an unknown plan are refused with 403 plan_limit_reached
        before anything is reserved (upload the file in the dashboard, Media, which every plan can
        use). One daily budget per account and UTC day counts every upload link (from any key or
        app) and the URL imports of connected AI apps: Beginner 2 GB, Apprentice 10 GB, Skilled 25
        GB, Expert and Agency 100 GB; uploading in the dashboard has no daily budget. A link holds its
        size until it closes, and bytes that arrived still count when the check refuses them or the
        upload is cancelled. Per account: 10 uploads open at once, 20 new links in 10 minutes and
        100 a day, and 60 upload-link calls a minute (new links, tokens, complete and cancel
        together).


        These answers also carry next_step (what to do next, in a sentence) and most refusals retry
        ("never", or "after_reset" for a budget that frees at 00:00 UTC), because the AI connector
        reads the same answers; the schemas and the examples leave both out. The request log keeps a
        summary of each answer (ids, status, type, size and times), never the token, the upload
        address or the command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadLinkRequest'
            examples:
              withCommand:
                summary: A 282 MB video, with a ready-made command for sh
                value:
                  file_name: EP01.mp4
                  size_bytes: 295698432
                  sha256: 9F2C4B6A8E0D1C3B5A7F9E1D3C5B7A9F0E2D4C6B8A0F1E3D5C7B9A1F3E5D7C9B
                  shell: sh
                  max_run_seconds: 540
              ownClient:
                summary: An image, sent with your own TUS client (no command)
                value:
                  file_name: cover.png
                  size_bytes: 1048576
                  sha256: 3b7c1d9e5f2a8c4e6d0b9a7f5e3c1d2b4a6f8e0d9c7b5a3f1e2d4c6b8a0f9e7d
      responses:
        '201':
          description: A new link. Send the file (run uploader.command, or use your own TUS client), then POST /media/uploads/{file_id}/complete.
          headers:
            Cache-Control:
              $ref: '#/components/headers/UploadCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLink'
              examples:
