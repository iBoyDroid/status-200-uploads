                        S200_UPLOAD_URL='https://yglvofckrdutesfzxwyb.storage.supabase.co/storage/v1/upload/resumable/sign/bWVkaWEtdXBsb2Fkcy84ZjE0ZTQ1Zi1jZWVhLTQ2N2EtOWEzNi0xZDViMGUzYTdjMjEvMGU5ZDhjN2ItNmE1Zi00ZTNkLTljMmItMWEwZjllOGQ3YzZiLm1wNC80ZjNlMmQxYy0wYjlhLTQ4NzYtOTU0My0yMTBmZWRjYmE5ODc' \
                        S200_UPLOAD_TOKEN='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJvd25lciI6IjhmMTRlNDVmLWNlZWEtNDY3YS05YTM2LTFkNWIwZTNhN2MyMSIsInVybCI6Im1lZGlhLXVwbG9hZHMvOGYxNGU0NWYtY2VlYS00NjdhLTlhMzYtMWQ1YjBlM2E3YzIxLzBlOWQ4YzdiLTZhNWYtNGUzZC05YzJiLTFhMGY5ZThkN2M2Yi5tcDQiLCJ1cHNlcnQiOmZhbHNlLCJpYXQiOjE3OTEyODgwMDAsImV4cCI6MTc5MTI5NTIwMH0.Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-' \
                        S200_CHECK='be11386c' \
                        S200_MAX_SECONDS='540' \
                        S200_FILE='<PATH>' \
                        sh "$u" </dev/null; c=$?; rm -rf "$d"; exit $c; }
        '200':
          description: >-
            renewed true: the same file from the same API key already had an open link (a request sent
            again after a timeout, for example). The same upload.url with a fresh token; nothing new
            is reserved, and the upload continues where it stopped.
          headers:
            Cache-Control:
              $ref: '#/components/headers/UploadCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLink'
        '400':
          description: >-
            invalid_request: the body is not a JSON object; file_name, size_bytes (the exact size, a
            whole number above 0), sha256 (64 hex characters), shell, runner or max_run_seconds (30
            to 7000) is missing or wrong; or file_id was sent (a fresh token is POST
            /media/uploads/{file_id}/token). Nothing was reserved.
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '401':
          $ref: '#/components/responses/UploadUnauthorized'
        '403':
          description: >-
            plan_limit_reached: uploading from a computer needs a paid plan (error.plan,
            error.upgrade_url): Free or an unknown plan. Upload the file in the dashboard
            (Media) instead, or upgrade. account_being_deleted: this account is being deleted.
          x-error-codes: [plan_limit_reached, account_being_deleted]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
              examples:
                free:
                  summary: A Free account (next_step and retry left out)
                  value:
                    error:
                      code: plan_limit_reached
                      message: Uploading a file from a computer needs a paid plan (Beginner or higher), and this account is on the Free plan.
                      plan: free
                      upgrade_url: https://status200uploads.com/pricing
        '404':
          description: media_not_found - only when the open link this request matched was removed in the meantime. Send it again.
          x-error-codes: [media_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '409':
          description: >-
            upload_already_received: the same file from the same API key already arrived through an
            earlier link (under 23 hours old), and error.file_id names it: POST
            /media/uploads/{file_id}/complete instead of uploading it again. upload_closed: the open
            link this request matched was closed in the meantime; send it again.
          x-error-codes: [upload_already_received, upload_closed]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '410':
          description: upload_expired - only when the open link this request matched expired in the meantime. Send it again.
          x-error-codes: [upload_expired]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '413':
          description: >-
            media_too_large: larger than the largest file, videos 5 GB (5,368,709,120 bytes) and
            images 20 MB (error.size_bytes, error.max_bytes). Nothing was reserved.
          x-error-codes: [media_too_large]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '415':
          description: >-
            unsupported_media_type: file_name's extension is not one of the types taken (.mp4 and
            .m4v, .mov, .webm, .jpg and .jpeg, .png, .webp). Convert the file first. Nothing was
            reserved.
          x-error-codes: [unsupported_media_type]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '422':
          description: upload_rejected, upload_failed - only when the open link this request matched was checked and closed in the meantime (error.reason says why).
          x-error-codes: [upload_rejected, upload_failed]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '429':
          description: >-
            import_budget_exhausted: the file does not fit what is left of today's budget
            (error.used_bytes, limit_bytes, remaining_bytes, requested_bytes, resets_at, plan and
            upgrade_url; held_bytes and held_until when unfinished upload links of this account hold
            part of it). It frees at 00:00 UTC (error.retry_after_seconds; the Retry-After header only
            when that is an hour or less), unless the file is larger than the whole day's budget: then
            there is no retry_after_seconds, and waiting does not help. too_many_open_uploads: 10
            uploads of this account are open (error.open, error.limit; Retry-After 60): finish or
            cancel one. rate_limited: 20 new links in 10 minutes or 100 today (error.window,
            error.limit, and error.resets_at for the day), or 60 upload-link calls this minute
            (error.limit); Retry-After says when. renewals_exhausted: the open link this request
            matched has had its 12 fresh tokens; cancel it and make a new one.
          x-error-codes: [import_budget_exhausted, too_many_open_uploads, rate_limited, renewals_exhausted]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
              examples:
                budget:
                  summary: Over what is left of a Beginner budget, while an unfinished link holds part of it (next_step and retry left out)
                  value:
                    error:
                      code: import_budget_exhausted
                      message: EP01.mp4 is 1.1 GB, and only 819.2 MB of today's 2 GB budget for files your apps upload or import is left on the Beginner plan. It resets at 00:00 UTC (in 12 h). 282 MB of it is reserved by upload links of this account whose file has not fully arrived; if they are not continued, that is free again by 13:51 UTC.
                      retry_after_seconds: 43200
                      used_bytes: 1288490188
                      held_bytes: 295698432
                      held_until: '2026-10-06T13:51:00.000Z'
                      limit_bytes: 2147483648
                      remaining_bytes: 858993460
                      requested_bytes: 1182793728
                      window: day
                      resets_at: '2026-10-07T00:00:00.000Z'
                      plan: beginner
                      upgrade_url: https://status200uploads.com/pricing
        '500':
          $ref: '#/components/responses/UploadServerError'
        '503':
          description: >-
            upload_links_paused: making links is paused for maintenance (upload the file and make
            the post in the dashboard, Media, or ask again later; never put a file from a computer on
            a public site to import it), or uploading from a computer is switched off for this one
            account (the message says "switched off for this account"; there is no Retry-After and
            asking again does not help: upload the file in the dashboard, Media, or write to
            info@status200uploads.com). uploads_busy: the limiter could not answer
            (Retry-After 30), too many uploads are running (600), or the plan could not be read and
            either the account's own record shows no paid plan or the file does not fit the budget an
            unread plan is given, Beginner's (60). Nothing was reserved.
          x-error-codes: [upload_links_paused, uploads_busy]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        default:
          $ref: '#/components/responses/UploadDefault'

  /media/uploads/{file_id}/token:
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/UploadMethodNotAllowed'
      note: Any method but POST (Allow POST, OPTIONS), answered after the key is checked (without a valid key, 401).
    parameters:
      - $ref: '#/components/parameters/UploadFileId'
    post:
      operationId: renewUploadToken
      tags: [Media]
      summary: A fresh token for an unfinished upload
      description: >-
        When the token expired before the whole file was sent (the uploader's exit 4, or storage
        answering 400 about the token): the same upload.url with a new upload.token, and with shell
        a new uploader.command, so the upload continues where it stopped. Only the API key that made
        the link can renew it (another key of the account gets 404), at most 12 times and within 24
        hours of the link, and only while the whole file has not arrived (then 409
        upload_already_received: complete it). A closed upload answers what completing it would
        (409, 410 or 422). The body is optional: shell, runner and max_run_seconds as for a new
        link; without them the answer has no uploader block.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTokenRequest'
      responses:
        '200':
