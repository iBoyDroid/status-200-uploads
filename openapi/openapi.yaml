        daily_limit_reached: [upgrade_url, used, limit, window, resets_at, plan, retry_after_seconds]
        x_limit_reached: [used, limit, resets_at, plan, retry_after_seconds]
        x_link_limit_reached: [link_used, link_limit, used, limit, resets_at, detected_links, plan, retry_after_seconds]
