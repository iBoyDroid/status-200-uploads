          x-error-codes: [media_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '409':
          description: >-
            upload_being_checked: the file is being checked right now (Retry-After 60): wait, or let
