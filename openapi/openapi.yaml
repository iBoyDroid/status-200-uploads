  x-status200-retry:
    version: 1
    rules:
      wait_and_resend: >-
        Nothing was sent, or the first answer comes back: wait Retry-After (else
        error.retry_after_seconds or retry_after_seconds, else 5 seconds), then send the IDENTICAL
        request again (the same body and the same Idempotency-Key). Cap the tries and the total wait.
      resend_once_with_key: >-
        The outcome may not be known. Send the identical request once more ONLY when it carried an
        Idempotency-Key (an answer we kept is replayed; a failure the network reported is sent afresh,
        as History's Retry would). Without a key, check History (GET /posts) instead.
      never: The same request cannot succeed now. Change it, or wait for resets_at; do not resend it.
      not_a_failure: Accepted. It goes out on its own; do not send it again.
    by_code:
      media_processing: wait_and_resend
      idempotency_in_progress: wait_and_resend
      rate_limited: wait_and_resend
      caller_check_unavailable: wait_and_resend
      schedule_check_unavailable: wait_and_resend
      idempotency_unavailable: wait_and_resend
      dry_run_unavailable: wait_and_resend
      upstream_unavailable: wait_and_resend
      cancel_unconfirmed: wait_and_resend
      skool_unavailable: wait_and_resend
      x_unavailable: wait_and_resend
      platform_error: resend_once_with_key
      server_error: resend_once_with_key
      upload_worker_failed: resend_once_with_key
      no_publish_id: resend_once_with_key
      idempotency_outcome_unknown: never
      idempotency_key_reused: never
      monthly_limit_reached: never
      daily_limit_reached: never
      daily_attempts_exceeded: never
      x_limit_reached: never
      x_link_limit_reached: never
      import_budget_exhausted: never
      scheduled: not_a_failure
      queued_for_next_day: not_a_failure
      still_publishing: not_a_failure
      schedule_unconfirmed: not_a_failure
    by_status:
      2xx: not_a_failure
      4xx: never
      5xx: resend_once_with_key
      not_json: resend_once_with_key

  x-status200-limits:
    idempotency_key_max_length: 255
    idempotency_ttl_hours: 24
    idempotency_retry_after_seconds: 5
    idempotency_stale_minutes: 10
    reads_per_minute: 60
    options_per_minute: 10
    list_page_default: 20
    list_page_max: 100
    max_schedule_ahead_days: 365
    schedule_now_within_seconds: 60
    max_waiting_scheduled: 500
    post_throttle_seconds: 20
    media_throttle_seconds: 20
    retry_after_header_max_seconds: 3600
    media_processing_retry_after_seconds: 30
    v2_media_wait_seconds: 12
    older_media_wait_seconds: 90
    v2_answer_within_seconds: 24
    media_answer_within_seconds: 22
    media_probe_timeout_seconds: 8
    image_import_max_mb: 20
    video_import_max_gb: 5
    media_kept_days: 7
