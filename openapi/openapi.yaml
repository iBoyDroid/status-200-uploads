                $ref: '#/components/schemas/MediaError'
        '500':
          description: As GET /api/v2/media, or the proxy's own failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaError'
        default:
          $ref: '#/components/responses/OlderMediaDefault'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: rl_ API key
      description: >-
        Authorization: Bearer rl_... An API key from the dashboard (API page), active. The word Bearer is
        read in any capital letters at every address. The same key works at both addresses.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional, POST only. 1 to 255 printable ASCII characters naming this one request (a UUID, for
        example); spaces around it and one pair of double quotes are removed, and an empty value is
        refused (400 idempotency_key_invalid). The same key with the same JSON body within 24 hours of
        the first request gets the first answer again, byte for byte, with Idempotent-Replayed: true.
        A key belongs to the API key that sent it; posts and media are kept apart; the two posts
        addresses share keys, and so do the two media addresses. Dry runs ignore it.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x20-\x7E]+$'
      example: 8e03978e-40d5-43e8-bc93-6894a57f9324
    PostId:
      name: id
      in: path
      required: true
      description: A post id (status200.post_id) or a scheduled post id (status200.scheduled_post_id). Not a UUID is 400.
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: A profile id from GET /accounts. Not a UUID is 400 (error.parameter id).
      schema:
        type: string
        format: uuid
    FileId:
      name: file_id
      in: query
      required: true
      description: The file_id from POST /media or POST /media/uploads. Missing or not a UUID is 400.
      schema:
        type: string
        format: uuid
    UploadFileId:
      name: file_id
      in: path
      required: true
      description: The file_id POST /media/uploads answered. Not a UUID is 400 invalid_request.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Items per page, 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: next_cursor from the previous page, exactly as it came. A cursor that is not ours is 400 (never "start again").
      schema:
        type: string
    StatusFilter:
      name: status
      in: query
      description: >-
        One or more, comma-separated. success, processing and timeout are posts; scheduled and
        cancelled are scheduled posts; failed is both. "published" is 400 with a hint (a scheduled post
        that went out is listed as its posts: use success).
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        items:
          type: string
          enum: [success, failed, processing, timeout, scheduled, cancelled]
    PlatformFilter:
      name: platform
      in: query
      description: One network. A scheduled post is listed when it includes it.
      schema:
        $ref: '#/components/schemas/Platform'
    KindFilter:
      name: kind
      in: query
      schema:
        type: string
        enum: [post, scheduled_post]
    ProfileIdFilter:
      name: profile_id
      in: query
      description: Only this profile (a UUID from GET /accounts).
      schema:
        type: string
        format: uuid
    PlatformsFilter:
      name: platforms
      in: query
      description: Only these networks, comma-separated; they are answered connected or not. Default every connected network.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/Platform'
    SkoolGroupSlug:
      name: skool_group_slug
      in: query
      description: Which Skool group to read the labels of (1 to 200 characters). With exactly one group, its labels come anyway.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MediaNameContains:
      name: name_contains
      in: query
      description: >-
        Files whose name holds every word of it, ignoring capital letters and punctuation (1 to 120
        characters): "beach day" finds Beach_Day-final.mp4.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    MediaTypeFilter:
      name: type
      in: query
      description: image (JPEG, PNG, WebP) or video (MP4, MOV, WebM), in any capital letters.
      schema:
        type: string
        enum: [image, video]
    MediaSince:
      name: since
      in: query
      description: >-
        Only files that arrived at or after this time: a date and time with a time zone, such as
        2026-10-08T14:05:00Z (the now of an earlier answer). It is read 2 minutes earlier to allow
        for clocks, so answers overlap: skip a file_id you already handled.
      schema:
        type: string
        format: date-time
    IncludeUnconfirmed:
      name: include_unconfirmed
      in: query
      description: >-
        true or false, in any capital letters (default false). Files that need the account holder's
        confirmation before they may be posted (confirm_before_posting true) are left out unless it is
        true, so a script that posts whatever is new never posts one by accident. No file needs one
        today.
      schema:
        type: boolean
        default: false

  headers:
    RetryAfter:
      description: >-
        Seconds to wait before the same request can succeed. On a 429 it is sent only when the wait is
        3600 seconds or less (a longer one is only in error.retry_after_seconds); 409 media_processing 30,
        409 idempotency_in_progress 5, the 503s that say nothing was sent 5, 504 cancel_unconfirmed 5.
        The upload links: 202 verifying 15 (longer when a check was delayed), 409 upload_being_checked
        60, 429 too_many_open_uploads 60, 503 uploads_busy 30, 60 or 600, and the 503 of a paused
        check 600.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: '"true" on an answer that is the stored first answer to this Idempotency-Key, sent again.'
      schema:
        type: string
        enum: ['true']
    CacheControl:
      description: >-
        private, no-store: a read answers for one key's owner, so nothing between may keep it (Netlify
        sends it as "private,no-store").
      schema:
        type: string
        examples: ['private, no-store']
    Vary:
      schema:
        type: string
        enum: [Authorization]
    Allow:
      schema:
        type: string
        enum: ['GET, OPTIONS']
    UploadAllow:
      schema:
        type: string
        enum: ['POST, OPTIONS', 'DELETE, OPTIONS']
    UploadCacheControl:
      description: >-
        private, no-store, on every upload-link answer: a link answer holds a token, so nothing
        between may keep a copy.
      schema:
        type: string
        examples: ['private, no-store']

  responses:
    Published:
      description: >-
        The network accepted the post (the body is its result inside data, so its fields differ per
        network), or a dry run's report (dry_run true). TikTok and Instagram finish after the answer:
        data.status is "processing" and the result appears in History.
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/DryRunReport'
              - $ref: '#/components/schemas/PublishResult'
          examples:
            tiktok:
              summary: TikTok (processing; post_id is ours)
              value:
                data:
                  status: processing
                  post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  publish_id: v_pub_url~v2-1.7123456789012345678
                  message: Post is being processed. Check post history for updates.
                status200:
                  post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/b2c3d4e5-f6a7-8901-bcde-f12345678901
            instagram:
              summary: Instagram (processing; post_id is ours)
              value:
                data:
                  status: processing
                  post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  container_id: '17912345678901234'
                  message: Post is being processed. Check post history for updates.
                status200:
                  post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/b2c3d4e5-f6a7-8901-bcde-f12345678901
            x:
              summary: X
              value:
                data:
                  tweet_id: '1841234567890123456'
                  text: Hello from the API
                  url: https://x.com/i/status/1841234567890123456
                status200:
                  post_id: e5f6a7b8-c9d0-1234-ef01-345678901234
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/e5f6a7b8-c9d0-1234-ef01-345678901234
            linkedin:
              summary: LinkedIn (post_id is LinkedIn's)
              value:
                data:
                  post_id: urn:li:share:7212345678901234567
                  url: https://www.linkedin.com/feed/update/urn:li:share:7212345678901234567
                status200:
                  post_id: e5f6a7b8-c9d0-1234-ef01-345678901234
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/e5f6a7b8-c9d0-1234-ef01-345678901234
            pinterest:
              summary: Pinterest
              value:
                data:
                  pin_id: '1146236468384210033'
                  url: https://www.pinterest.com/pin/1146236468384210033/
                  title: Recipe of the week
                  board_id: '900123'
                status200:
                  post_id: e5f6a7b8-c9d0-1234-ef01-345678901234
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/e5f6a7b8-c9d0-1234-ef01-345678901234
            threads:
              summary: Threads
              value:
                data:
                  thread_id: '18045678901234567'
                  permalink: https://www.threads.net/@myshop/post/C9abcdefgh
                status200:
                  post_id: e5f6a7b8-c9d0-1234-ef01-345678901234
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/e5f6a7b8-c9d0-1234-ef01-345678901234
            skool:
              summary: Skool (post_id is Skool's)
              value:
                data:
                  post_id: 8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d
                  url: https://www.skool.com/mygroup/my-first-post
                status200:
                  post_id: e5f6a7b8-c9d0-1234-ef01-345678901234
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/e5f6a7b8-c9d0-1234-ef01-345678901234
            facebook:
              summary: Facebook (Graph's own fields)
              value:
                data:
                  id: '123456789012345_987654321098765'
                  permalink: https://www.facebook.com/123456789012345/posts/987654321098765
                status200:
                  post_id: e5f6a7b8-c9d0-1234-ef01-345678901234
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/e5f6a7b8-c9d0-1234-ef01-345678901234
            dryRun:
              summary: A dry run's report
              value:
                dry_run: true
                checked_at: '2026-09-28T10:00:00.000Z'
                target:
                  account_id: '@myprofile'
                  profile_id: d4e5f6a7-b8c9-0123-def0-234567890123
                  platform: pinterest
                outcome: publish
                would_publish: true
                reason: null
                warnings: []
                plan:
                  tier: skilled
                  is_admin: false
                  allowance:
                    kind: unlimited
                    used: null
                    limit: null
                    resets_at: null
                media:
                  count: 1
                  type: image
                  from: urls
                checks:
                  - name: request
                    status: ok
                  - name: profile
                    status: ok
    Accepted:
      description: >-
        Accepted, not published yet, and never a failure: do not send the request again (with the
        same Idempotency-Key it only gets this answer back). If code is present, switch on code
        (scheduled, queued_for_next_day, still_publishing, schedule_unconfirmed); otherwise data.status
        is "processing" (every YouTube upload, large videos on X, LinkedIn, Facebook and Skool).
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
          examples:
            scheduled:
              summary: Scheduled for post.scheduledFor
              value:
                scheduled: true
                code: scheduled
                message: Scheduled for 2026-10-01T09:00:00.000Z. It will be published then, usually within a few minutes of that time. Your plan's allowance is checked when it goes out, not now. To cancel it, send DELETE https://status200uploads.com/api/v2/posts/c3d4e5f6-a7b8-9012-cdef-123456789012.
                scheduled_post_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                scheduled_at: '2026-10-01T09:00:00.000Z'
                platform: tiktok
                profile_id: d4e5f6a7-b8c9-0123-def0-234567890123
                data:
                  status: scheduled
                  scheduled_post_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                  scheduled_at: '2026-10-01T09:00:00.000Z'
                status200:
                  post_id: null
                  scheduled_post_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                  status_url: https://status200uploads.com/api/v2/posts/c3d4e5f6-a7b8-9012-cdef-123456789012
            queued:
              summary: Queued for the next UTC day (daily allowance used up)
              value:
                queued: true
                code: queued_for_next_day
                message: Daily post limit reached for this profile (20/20 today, all platforms combined). Post queued for 2026-09-29T14:30:00.000Z.
                upgrade_url: https://status200uploads.com/pricing
                scheduled_post_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                scheduled_at: '2026-09-29T14:30:00.000Z'
                limit: 20
                used: 20
                plan: beginner
                status200:
                  post_id: null
                  scheduled_post_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  status_url: https://status200uploads.com/api/v2/posts/a1b2c3d4-e5f6-7890-abcd-ef1234567890
            stillPublishing:
              summary: The network is slower than the request can wait
              value:
                success: false
                status: unknown
                code: still_publishing
                retry: false
                message: 'The network is taking longer than this request can wait, so the outcome is not known yet. Publishing continues in the background and the result appears in the post history within a few minutes. Do not send this request again: it may already have been published.'
                post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                status200:
                  post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/b2c3d4e5-f6a7-8901-bcde-f12345678901
            processing:
              summary: A YouTube upload (always in the background)
              value:
                data:
                  status: processing
                  post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  job_id: f6a7b8c9-d0e1-2345-f012-456789012345
                  message: YouTube upload is processing in the background. Check post history for updates.
                status200:
                  post_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  scheduled_post_id: null
                  status_url: https://status200uploads.com/api/v2/posts/b2c3d4e5-f6a7-8901-bcde-f12345678901
    PostsTooManyRequests:
      description: >-
        Every 429 carries error.retry_after_seconds. rate_limited: less than 20 seconds since your
        previous post to the same network, or Skool's own limit (Retry-After). monthly_limit_reached
        (Free), daily_limit_reached, x_limit_reached, x_link_limit_reached: not before resets_at (a
        longer wait than an hour has no Retry-After header). daily_attempts_exceeded: after 00:00 UTC.
        pinterest_rejected: Pinterest's own 429 (its rate limit), with Pinterest's reason.
      x-error-codes: [rate_limited, monthly_limit_reached, daily_limit_reached, x_limit_reached, x_link_limit_reached, daily_attempts_exceeded, pinterest_rejected]
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PostsUnavailable:
      description: >-
        Nothing was posted. caller_check_unavailable, schedule_check_unavailable,
        idempotency_unavailable and dry_run_unavailable carry Retry-After 5 and retry_after_seconds 5:
        send the same request again then. skool_unavailable, x_unavailable: the network is not taking
        posts from us right now; try again later.
      x-error-codes: [caller_check_unavailable, schedule_check_unavailable, idempotency_unavailable, dry_run_unavailable, skool_unavailable, x_unavailable]
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: A method /api/v2/posts does not answer.
      x-error-codes: [method_not_allowed]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: There is no API endpoint at this path (the message lists the endpoints).
      x-error-codes: [not_found]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadMethodNotAllowed:
      description: The accounts paths and /media/files answer GET only.
      x-error-codes: [method_not_allowed]
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadBadRequest:
      description: A parameter (or the id) cannot be used; error.parameter names it.
      x-error-codes: [bad_request]
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadUnauthorized:
      description: No key, or a key that is not active.
      x-error-codes: [unauthorized]
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadTooManyRequests:
      description: 60 reads a minute per account, or 10 posting options (error.limit says which).
      x-error-codes: [rate_limited]
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadServerError:
      description: It could not be read just now, and nothing changed. Try again in a minute.
      x-error-codes: [server_error]
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MediaMethodNotAllowed:
      description: '{"error": "Method Not Allowed. Use POST /api/v2/media."} on /api/v2/media; {"error": "Method Not Allowed"} on the older address.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaError'
    OlderMethodNotAllowed:
      description: 'api_error "Method not allowed".'
      x-error-codes: [api_error]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OlderErrorResponse'
    Default:
      description: >-
        Any other answer. On /api/v2 every JSON error carries error.code (derived from the status when
        the network gave none). Not JSON at all: Netlify's HTML 504 after 30 seconds of silence (rare:
        our answers come within about 25 seconds).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        text/html:
          schema:
            type: string
    OlderDefault:
      description: >-
        Any other answer, including a network's own error passed on as it is. Not JSON at all: the
        Supabase gateway's 504 or 546 after 150 seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OlderErrorResponse'
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
    MediaDefault:
      description: >-
        Any other answer of /api/v2/media, in the media shape (MediaError). Not JSON at all: Netlify's
        HTML 504 after 30 seconds of silence (rare: the import answers within about 22 seconds).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaError'
        text/html:
          schema:
            type: string
    OlderMediaDefault:
      description: >-
        Any other answer of the older media address, in the media shape (MediaError). Not JSON at all:
        a gateway's HTML or plain-text page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaError'
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
    UploadUnauthorized:
      description: >-
        unauthorized: no key ("Missing Authorization: Bearer <api_key>."), or a key that is not
        active ("Invalid or revoked API key."), also when it was revoked while the link was being
        made.
      x-error-codes: [unauthorized]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadLinkErrorResponse'
    UploadServerError:
      description: >-
        server_error: our side failed, or the key could not be checked just now. Nothing was handed
        out: send the same request again in a minute (the same file from the same key finds its open
        link, so nothing is reserved twice).
      x-error-codes: [server_error]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadLinkErrorResponse'
    UploadMethodNotAllowed:
      description: A method this upload-link path does not take; the message names the one it does.
      x-error-codes: [method_not_allowed]
      headers:
        Allow:
          $ref: '#/components/headers/UploadAllow'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadLinkErrorResponse'
    UploadDefault:
      description: >-
        Any other answer of the upload-link endpoints, in their shape (UploadLinkErrorResponse). Not
        JSON at all: Netlify's HTML 504 after 30 seconds of silence (rare: these endpoints answer
        within about 22 seconds).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadLinkErrorResponse'
        text/html:
          schema:
            type: string

  schemas:
    Platform:
      type: string
      enum: [tiktok, instagram, facebook, youtube, x, linkedin, pinterest, threads, skool]

    PostRequest:
      type: object
      required: [post]
      properties:
        post:
          $ref: '#/components/schemas/Post'
        dryRun:
          type: boolean
          description: >-
            true: check this post and send nothing (every check a publish makes; the answer is 200 with
            dry_run true, and it is not counted in the key's request count). false or absent: publish.
            Also read as dry_run, and inside post; a dry run may send the post as validate instead of
            post. Any value but true or false (or true in one place and false in another) is 400 and
            nothing is published.
      description: >-
        A field this API does not read never refuses a post: the answer names it in warnings.

    Post:
      type: object
      required: [accountId, platform]
      properties:
        accountId:
          type: string
          minLength: 1
          description: >-
            The profile: its UUID, "@name" or the bare name, as on the Connections page (GET /accounts
            lists them). Capital letters do not matter; two profiles whose names differ only by capital
            letters are 400 profile_name_ambiguous (send the exact name or the id). A profile that is
            not yours is 403 account_not_found (404 api_error on the older address).
          examples: ['@myprofile', d4e5f6a7-b8c9-0123-def0-234567890123]
        platform:
          $ref: '#/components/schemas/Platform'
        scheduledFor:
          type: [string, number, 'null']
          description: >-
            When to publish. An ISO 8601 time
            WITH a time zone ("2026-09-30T10:00:00Z", "2026-09-30T12:00:00+02:00"), a date with the
            month as a word and a zone ("Wed, 30 Sep 2026 10:00:00 GMT"), or a Unix time in seconds or
            milliseconds (from 1e11). Absent, null, "" or "now", a past time, or one within 60 seconds:
            published now. More than 60 seconds and up to 365 days ahead: scheduled (202 scheduled; at
            most 500 posts waiting per account). Otherwise 400 scheduled_for_invalid with error.reason
            no_time_zone (even a past time without a zone), unreadable (not a date and time, a date
            written with numbers only such as 01/10/2026 included) or too_far_ahead.
          examples: ['2026-10-01T09:00:00Z', 1790000000]
        content:
          $ref: '#/components/schemas/PostContent'
        tiktok:
          $ref: '#/components/schemas/TikTokOptions'
        instagram:
          $ref: '#/components/schemas/InstagramOptions'
        facebook:
          $ref: '#/components/schemas/FacebookOptions'
        youtube:
          $ref: '#/components/schemas/YouTubeOptions'
        x:
          $ref: '#/components/schemas/XOptions'
        linkedin:
          $ref: '#/components/schemas/LinkedInOptions'
        pinterest:
          $ref: '#/components/schemas/PinterestOptions'
        threads:
          $ref: '#/components/schemas/ThreadsOptions'
        skool:
          $ref: '#/components/schemas/SkoolOptions'
      description: >-
        One flat post. Only the option block of post.platform is read (another network's block is named
        in warnings). Per network: Pinterest needs pinterest.boardId (400 pinterest_board_required); Skool
        needs skool.group and skool.title; media is required except for text posts on X, LinkedIn,
        Threads, Skool and Facebook (400 otherwise). dryRun may also be sent inside post (and as
        dry_run).

    PostContent:
      type: object
      properties:
        text:
          type: string
          description: >-
            The caption, post text or title. Required when the post has no media. On YouTube and TikTok
            photo posts it fills the title or the description you do not send.
        mediaUrls:
          type: array
          items:
            type: string
          description: >-
            Public URLs of the files. Whether a file is an image or a video is read from the end of its
            URL (.jpg, .png, .mp4 ...). A scheduled post fetches them when it goes out, not now (warning
            media_url_not_kept). Not used when file ids are sent too. Each must be a full web address that
            a URL parser reads, starting with https:// or http://; anything else (a file name joined in
            front of the address, a file path, an empty value, a value that is not text) is 400 bad_request
            with error.field (for example post.content.mediaUrls[0]), before anything is sent. Every item
            of content.mediaUrls is checked, even one the network would not use (Pinterest, YouTube, a
            Facebook video and an Instagram Reel use only the first). An address with spaces or other
            unusual characters that the parser reads is sent as it came.
        mediaID:
          type: array
          items:
            type: string
          description: >-
            File ids from POST /media, or from an upload link once POST /media/uploads/{file_id}/complete
            said ready (UUIDs; also read as mediaIds). Used first, before mediaUrls. An id that does not
            exist on your account is 404 media_not_found, and so is an upload link's file that is not
            ready yet; one still importing is waited for, then 409 media_processing. A value sent as
            text instead of a list is 400.

    TikTokOptions:
      type: object
      properties:
        privacyLevel:
          type: string
          enum: [PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY]
          default: SELF_ONLY
          description: >-
            Only the levels GET /accounts/{profile_id}/options lists for the account are accepted by
            TikTok. privacyStatus (YouTube's name) is not read here: the post goes out as SELF_ONLY and
            warnings says so.
        disabledComments:
          type: boolean
          default: false
        disabledDuet:
          type: boolean
          default: false
          description: Videos only.
        disabledStitch:
          type: boolean
          default: false
          description: Videos only.
        isBrandedContent:
          type: boolean
          default: false
        isYourBrand:
          type: boolean
          default: false
        isAiGenerated:
          type: boolean
          default: false
          description: Videos only.
        autoAddMusic:
          type: boolean
          default: false
          description: Photo posts only.
        title:
          type: string
          description: A photo post's title (up to 90 characters; longer is shortened at the end of a word). On a video it is the caption (up to 2,200 characters) instead of content.text.
        description:
          type: string
          description: A photo post's description (up to 4,000 characters). Not used on a video.
      description: >-
        Photos: TikTok takes them up to 1080 x 1920 pixels (1920 x 1080 when wide). A larger JPEG is
        sent as a smaller copy inside that size, and warnings says so with both sizes
        (resized_for_tiktok); a larger photo that cannot be made smaller is refused before anything is
        sent (422 photo_too_large_to_resize). The original file is never changed. The limits and every
        message: https://status200uploads.com/docs/api#tiktok-photos.

    InstagramOptions:
      type: object
      properties:
        postType:
          type: string
          enum: [feed_image, reel, story, carousel]
          description: Omitted, carousel for two or more files, reel for a single video, otherwise feed_image.
        shareToFeed:
          type: boolean
          default: true
          description: Reels only.
        coverUrl:
          type: string
          description: >-
            A Reel's cover image URL (fetched by Instagram when the Reel goes out; not sent for other post
            types). It must be a full web address starting with https:// or http://, or 400 bad_request
            with error.field post.instagram.coverUrl. The spaces around it are removed before it is
            checked and sent, as for a scheduled Reel, and a blank coverUrl means no cover.
        thumbOffset:
          type: number
          description: A Reel's thumbnail offset in milliseconds.
        collaborators:
          type: array
          items:
            type: string
          description: Usernames to invite as collaborators.
        locationId:
          type: string
          description: A Facebook location id (feed images).

    FacebookOptions:
      type: object
      properties:
        postType:
          type: string
          enum: [photo, video, reel, text]
          description: >-
            Omitted, text when the post has no media field at all, video for one video file, otherwise
            photo (several images make one multi-photo post). Without a postType, a media field sent
            empty ([] or null) is 400.
        videoTitle:
          type: string
          description: The title of a video post (defaults to the caption).
        url:
          type: string
          description: A link for a text post (Facebook makes a link preview).

    YouTubeOptions:
      type: object
      properties:
        title:
          type: string
          description: The video title, up to 100 characters (longer is shortened at the end of a word). Without it the title comes from content.text.
        description:
          type: string
          description: The description, up to 5,000 bytes. Without it, content.text when a title was sent.
        privacyStatus:
          type: string
          enum: [public, unlisted, private]
          default: private
        tags:
          type: array
          items:
            type: string
          description: YouTube allows 500 characters of tags counted its own way; a longer list is 400 youtube_tags_too_long before the upload.
        categoryId:
          type: string
          default: '22'
        madeForKids:
          type: boolean
          default: false
        embeddable:
          type: boolean
          default: true
        license:
          type: string
          enum: [youtube, creativeCommon]
          default: youtube
        publicStatsViewable:
          type: boolean
          default: true
        notifySubscribers:
          type: boolean
          default: true
        defaultLanguage:
          type: string
          description: The language of the title and description (en, es, fr ...).

    XOptions:
      type: object
      properties:
        text:
          type: string
          description: Overrides content.text for X.
        whoCanReply:
          type: string
          enum: [everyone, following, mentionedUsers, subscribers, verified]
          default: everyone
        community:
          type: string
          description: The community's link (https://x.com/i/communities/<id>); anything else is not used (warnings says so).
        madeWithAi:
          type: boolean
          x-status200-not-used: true
          description: Accepted but not used (X gets no label); named in warnings.
        paidPartnership:
          type: boolean
          x-status200-not-used: true
          description: Accepted but not used (X gets no label); named in warnings.

    LinkedInOptions:
      type: object
      properties:
        text:
          type: string
          description: Overrides content.text for LinkedIn.
        carousel:
          type: boolean
          x-status200-not-used: true
          description: Not supported; not used, and named in warnings.
        carouselName:
          type: string
          x-status200-not-used: true
          description: Not supported; not used, and named in warnings.

    PinterestOptions:
      type: object
      properties:
        boardId:
          type: string
          description: >-
            Required for a pin: Pinterest's id of the board (GET /accounts/{profile_id}/options lists the
            boards). Also read as board_id. Without it the post is 400 pinterest_board_required before
            Pinterest is called.
        title:
          type: string
          description: Cut to 100 characters; content.text when omitted.
        description:
          type: string
          description: Cut to 800 characters. Without it the pin has no description.
        link:
          type: string
        altText:
          type: string
        dominantColor:
          type: string
          description: A hex colour such as '#FF5733'.

    ThreadsOptions:
      type: object
      properties:
        text:
          type: string
          description: Overrides content.text for Threads. Text over 500 characters, more than 20 files, or neither text nor media is 400.

    SkoolOptions:
      type: object
      properties:
        group:
          type: string
          description: Required. The Skool group id (GET /accounts/{profile_id}/options lists the groups).
        groupSlug:
          type: string
        label:
          type: string
          description: A category label id.
        title:
          type: string
          description: Required. The post title.

    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          x-known-values: [unknown_field, field_not_used, options_outside_post, converted_to_jpeg, resized_for_tiktok, title_shortened, description_shortened, characters_removed, text_partly_used, title_missing, media_url_not_kept, skool_one_post_per_hour, posts_close_together, caption_over_limit, unknown_parameter, moved_to_next_day]
        message:
          type: string
        field:
          type: string
          description: Where the field sits in the request, e.g. post.youtube.allowEmbedding.
        did_you_mean:
          type: string
        photo:
          type: integer
          description: >-
            converted_to_jpeg and resized_for_tiktok - which photo of the post, counting from 1.
        photos:
          type: integer
          description: resized_for_tiktok - how many photos the post has.
        from:
          type: string
          x-known-values: [png, gif, jpeg]
          description: converted_to_jpeg and resized_for_tiktok - the photo's own format.
        size:
          $ref: '#/components/schemas/PhotoSize'
        copy_size:
          $ref: '#/components/schemas/PhotoSize'
        scheduled_post_id:
          type: string
          format: uuid
          description: >-
            moved_to_next_day (a notice of a post read back) - the scheduled post the networks that did
            not fit the day moved to, at the same time on the next day.
        platforms:
          type: array
          items:
            type: string
          description: moved_to_next_day - the networks that moved.
      description: >-
        Something the caller should know about a request that went through. The post was still sent.
        resized_for_tiktok (a TikTok photo larger than 1080 x 1920 sent as a smaller copy) also carries
        size (the photo, as it is shown) and copy_size (what TikTok got); see
        https://status200uploads.com/docs/api#tiktok-photos. moved_to_next_day is a notice only (a post
        read back, never a publish answer): another network of the same scheduled post did not fit the
        day's allowance while the post was going out and moved to the next day as a scheduled post of
        its own (scheduled_post_id, platforms). Do not send those networks again: that post sends them.

    PhotoSize:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
        height:
          type: integer
      description: A photo's size in pixels, as the photo is shown (after its EXIF orientation).

    Status200Ids:
      type: object
      required: [post_id, scheduled_post_id, status_url]
      properties:
        post_id:
          type: [string, 'null']
          format: uuid
          description: Our History id.
        scheduled_post_id:
          type: [string, 'null']
          format: uuid
        status_url:
          type: string
          format: uri
          description: GET https://status200uploads.com/api/v2/posts/<post_id, else scheduled_post_id>.
      description: >-
        Our ids, on every answer (any status) that recorded a post in History or a scheduled post;
        never on a dry run or on a refusal that recorded nothing. Use it rather than data.post_id,
        which is the network's own id on Facebook, LinkedIn and Skool.

    PublishResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: >-
            The network's result. TikTok {status "processing", post_id (ours), publish_id, message};
            Instagram {status "processing", post_id (ours), container_id, message}; X {tweet_id, text,
            url}; LinkedIn {post_id (LinkedIn's), url}; Pinterest {pin_id, url, title, board_id};
            Threads {thread_id, permalink}; Skool {post_id (Skool's), url}; Facebook Graph's own {id,
            post_id?, video_id?, permalink?}; YouTube youtube-api's {video_id, url}.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        status200:
          $ref: '#/components/schemas/Status200Ids'

    DryRunReport:
      type: object
      required: [dry_run, checked_at, target, outcome, would_publish, reason, warnings, plan, media, checks]
      properties:
        dry_run:
          type: boolean
          const: true
        checked_at:
          type: string
          format: date-time
        target:
          type: object
          required: [account_id, profile_id, platform]
          properties:
            account_id:
              type: [string, 'null']
            profile_id:
              type: [string, 'null']
            platform:
              type: [string, 'null']
        outcome:
          type: string
          x-known-values: [publish, queue, refuse, schedule]
        would_publish:
          type: boolean
        reason:
          type: [object, 'null']
          description: Why it would not go out now, with the code, message and HTTP status this address would answer (and that refusal's extras). null when outcome is publish.
          required: [code, message, status]
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
              also_blocking:
                type: boolean
                description: A second refusal after the one in reason.
        plan:
          type: [object, 'null']
          properties:
            tier:
              type: string
            is_admin:
              type: boolean
            allowance:
              type: object
              properties:
                kind:
                  type: string
                used:
                  type: [integer, 'null']
                limit:
                  type: [integer, 'null']
                resets_at:
                  type: [string, 'null']
        media:
          type: object
          required: [count, type, from]
          properties:
            count:
              type: integer
            type:
              type: [string, 'null']
            from:
              type: string
              x-known-values: [ids, urls, none]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string
                x-known-values: [ok, refused, warning, skipped]
              note:
                type: string
        will_send:
          type: object
          description: YouTube and TikTok only; the title and description a publish would send.
          properties:
            title:
              type: string
            description:
              type: string

    Accepted:
      type: object
      properties:
        code:
          type: string
          x-known-values: [scheduled, queued_for_next_day, still_publishing, schedule_unconfirmed]
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: string
              x-known-values: [processing, scheduled]
            post_id:
              type: [string, 'null']
            job_id:
              type: [string, 'null']
            message:
              type: string
            scheduled_post_id:
              type: string
              format: uuid
            scheduled_at:
              type: string
              format: date-time
        scheduled:
          type: boolean
          description: true on a scheduled post (code scheduled).
        queued:
          type: boolean
          description: true only when the daily allowance moved the post to the next UTC day.
        scheduled_post_id:
          type: string
          format: uuid
          description: DELETE /posts/{scheduled_post_id} cancels it.
        scheduled_at:
          type: string
          format: date-time
        platform:
          type: string
        profile_id:
          type: string
          format: uuid
        upgrade_url:
          type: string
          format: uri
        limit:
          type: integer
        used:
          type: integer
        plan:
          type: string
        success:
          type: boolean
          description: false on still_publishing and schedule_unconfirmed (the outcome is not known yet).
        status:
          type: string
          x-known-values: [unknown]
        retry:
          type: boolean
          description: >-
            Always false, on still_publishing and schedule_unconfirmed only: do not send this request
            again. A boolean, not a rule (REST refusals carry no retry field).
        post_id:
          type: string
          format: uuid
          description: still_publishing, when the post is already in History.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        status200:
          $ref: '#/components/schemas/Status200Ids'
      x-status200-required-by-code:
        scheduled: [scheduled, code, message, scheduled_post_id, scheduled_at, platform, profile_id, data, status200]
        queued_for_next_day: [queued, code, message, upgrade_url, scheduled_post_id, scheduled_at, limit, used, plan, status200]
        still_publishing: [success, status, code, retry, message]
        schedule_unconfirmed: [success, status, code, retry, message]
        (no code): [data]

    ErrorObject:
      type: object
      required: [code, message]
      properties: &errorFields
        code:
          type: string
          description: Branch on this, not on the status alone. Each response lists its codes in x-error-codes; new codes are added without notice.
        message:
          type: string
          description: A sentence for a person, saying what to do.
        profiles:
          type: array
          items:
            type: string
          description: account_not_found and profile_name_ambiguous (the older address's 404 api_error too) - your profiles as "@name", at most 25.
        file_id:
          type: string
        progress:
          type: [integer, 'null']
        retry_after_seconds:
          type: integer
          description: On every 429, and on the refusals that ask for a short wait.
        upgrade_url:
          type: string
          format: uri
        required:
          type: string
          x-known-values: [beginner, x_addon]
        platform:
          type: string
        plan:
          type: string
        used:
          type: integer
        limit:
          type: integer
        window:
          type: string
          x-known-values: [day, month]
        resets_at:
          type: string
          format: date-time
        trial_available:
          type: boolean
        reason:
          type: string
          x-known-values: [no_time_zone, unreadable, too_far_ahead]
        scheduled_for:
          description: The post.scheduledFor value as it was sent.
        status:
          type: string
          x-known-values: [processing, published, failed, scheduled]
          description: not_cancellable - the scheduled post's status.
        tags_length:
          type: integer
        max_tags_length:
          type: integer
        remove_tags:
          type: integer
        size_bytes:
          type: integer
        limits_url:
          type: string
          format: uri
        max_video_bytes:
          type: [integer, 'null']
          description: >-
            MEDIA_TOO_LARGE - the network's video limit here; null when the network takes no video here
            (Pinterest).
        max_image_bytes:
          type: [integer, 'null']
          description: MEDIA_TOO_LARGE - the network's image limit; null when the network takes no image (YouTube).
        parameter:
          type: string
          description: The reads' 400 - which parameter.
        started_at:
          type: string
        first_used_at:
          type: string
        url:
          type: string
        field:
          type: string
          description: >-
            Where the refused value sits in the request, for example post.content.mediaUrls[0] or
            post.instagram.coverUrl (bad_request for a media address that is not a web address,
            media_not_available for a cover that is gone).
        upstream_status:
          type: integer
        attempts:
          type: integer
        ceiling:
          type: integer
        detected_links:
          type: array
          items:
            type: string
        link_used:
          type: integer
        link_limit:
          type: integer
        photo:
          type: integer
          description: >-
            The TikTok photo refusals (photo_format_not_supported, photo_too_large_to_convert,
            photo_too_large_to_resize, photo_conversion_failed) - which photo of the post, counting from 1.
      x-status200-required-by-code: &errorRequiredByCode
        plan_required: [required, platform, plan, upgrade_url]
        monthly_limit_reached: [upgrade_url, used, limit, window, resets_at, plan, trial_available, retry_after_seconds]
        daily_limit_reached: [upgrade_url, used, limit, window, resets_at, plan, retry_after_seconds]
        x_limit_reached: [used, limit, resets_at, plan, retry_after_seconds]
        x_link_limit_reached: [link_used, link_limit, used, limit, resets_at, detected_links, plan, retry_after_seconds]
        daily_attempts_exceeded: [attempts, ceiling, plan, retry_after_seconds]
        rate_limited: [retry_after_seconds]
        media_processing: [file_id, progress, retry_after_seconds]
        media_not_found: [file_id]
        media_failed: [file_id]
        scheduled_for_invalid: [scheduled_for, reason]
        youtube_tags_too_long: [platform, tags_length, max_tags_length, remove_tags]
        MEDIA_TOO_LARGE: [platform, size_bytes, limits_url]
        profile_name_ambiguous: [profiles]
        not_cancellable: [status]
        scheduled_queue_full: [limit]
        idempotency_in_progress: [retry_after_seconds]
        idempotency_unavailable: [retry_after_seconds]
        caller_check_unavailable: [retry_after_seconds]
        schedule_check_unavailable: [retry_after_seconds]
        dry_run_unavailable: [retry_after_seconds]
        cancel_unconfirmed: [retry_after_seconds]
        upload_worker_failed: [upstream_status]
      description: >-
        REST refusals carry code, message and, for a plan refusal, upgrade_url, plus the facts of the
        refusal below. They carry no next_step and no retry field (those are the AI connector's); what
        a client may send again is components.x-status200-retry.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        status200:
          $ref: '#/components/schemas/Status200Ids'

    OlderErrorObject:
      type: object
      required: [message]
      # The same fields as ErrorObject (a YAML alias of its properties and of the fields each code carries).
      properties: *errorFields
      x-status200-required-by-code: *errorRequiredByCode
      description: >-
        The same fields as ErrorObject, with code not guaranteed: it is missing only when a network's own
        error named none (it is passed on as it is).

    OlderErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/OlderErrorObject'
        status200:
          $ref: '#/components/schemas/Status200Ids'

    CancelResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [scheduled_post_id, status, platforms, was_due_at, message]
          properties:
            scheduled_post_id:
              type: string
              format: uuid
            status:
              type: string
              x-known-values: [cancelled]
            platforms:
              type: array
              items:
                type: string
            was_due_at:
              type: string
              description: When it was due (its scheduled_at).
            message:
              type: string
            already_cancelled:
              type: boolean
              description: Present (true) when it was cancelled before this request. Nothing changed.
      example:
        data:
          scheduled_post_id: c3d4e5f6-a7b8-9012-cdef-123456789012
          status: cancelled
          platforms: [tiktok]
          was_due_at: '2026-10-01T09:00:00+00:00'
          message: Cancelled. It will not be published.

    AccountList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'

    Account:
      type: object
      required: [profile_id, profile_name, handle, created_at, networks]
      properties:
        profile_id:
          type: string
          format: uuid
        profile_name:
          type: string
        handle:
          type: string
          description: '"@" and the profile name: usable as post.accountId.'
        created_at:
          type: [string, 'null']
          format: date-time
        networks:
          type: array
          items:
            $ref: '#/components/schemas/AccountNetwork'

    AccountNetwork:
      type: object
      required: [platform, username, status, health, access_expires_at, connected_at, updated_at]
      properties:
        platform:
          type: string
        username:
          type: [string, 'null']
        status:
          type: string
          x-known-values: [connected, expired]
          description: >-
            The connection's own status. expired: the saved sign-in has expired or stopped working (for Instagram,
            Facebook and Threads also when Meta refused it on a post, a read or a renewal and again on our own
            check); reconnect it on the Connections page.
        health:
          type: string
          x-known-values: [ready, reconnect_required, unknown]
          description: ready = it can post now (a sign-in the network renews by itself on the next post included); reconnect_required = reconnect it on the Connections page.
        access_expires_at:
          type: [string, 'null']
          format: date-time
        connected_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    PostingOptions:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [profile_id, profile_name, networks, note, asked_at]
          properties:
            profile_id:
              type: string
              format: uuid
            profile_name:
              type: string
            networks:
              type: array
              items:
                $ref: '#/components/schemas/NetworkOptions'
            note:
              type: [string, 'null']
            asked_at:
              type: string
              format: date-time
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'

    NetworkOptions:
      type: object
      required: [platform, status, options, note, checked_at, cached, error_code]
      properties:
        platform:
          type: string
        status:
          type: string
          x-known-values: [ok, not_connected, reconnect_required, unavailable, no_options]
          description: Only ok carries options; every other status has a note saying why not.
        options:
          type: [object, 'null']
          description: Shaped per network (x-status200-options-by-platform names each schema).
        note:
          type: [string, 'null']
        checked_at:
          type: [string, 'null']
          format: date-time
        cached:
          type: boolean
        error_code:
          type: [string, 'null']
      x-status200-options-by-platform:
        tiktok: TikTokPostingOptions
        pinterest: PinterestPostingOptions
        facebook: FacebookPostingOptions
        instagram: InstagramPostingOptions
        skool: SkoolPostingOptions
        youtube: YouTubePostingOptions

    TikTokPostingOptions:
      type: object
      properties:
        privacy_level_options:
          type: array
          items:
            type: string
          description: The only values TikTok will accept in post.tiktok.privacyLevel for this account (empty = it will not take a post right now).
        comment_disabled:
          type: boolean
        duet_disabled:
          type: boolean
        stitch_disabled:
          type: boolean
        max_video_post_duration_sec:
          type: [number, 'null']
        creator_username:
          type: [string, 'null']
        creator_nickname:
          type: [string, 'null']

    PinterestPostingOptions:
      type: object
      properties:
        boards:
          type: array
          items:
            type: object
            properties:
              id:
                type: [string, 'null']
                description: Send it as post.pinterest.boardId.
              name:
                type: [string, 'null']
              privacy:
                type: [string, 'null']
              pin_count:
                type: [number, 'null']

    FacebookPostingOptions:
      type: object
      properties:
        page_id:
          type: [string, 'null']
        page_name:
          type: [string, 'null']
        category:
          type: [string, 'null']
        followers:
          type: [number, 'null']

    InstagramPostingOptions:
      type: object
      properties:
        posts_used:
          type: [number, 'null']
        posts_allowed:
          type: [number, 'null']
        posts_left:
          type: [number, 'null']
        window_hours:
          type: [number, 'null']
      description: Instagram's rolling publishing limit. A null means Instagram did not report it, not a zero.

    SkoolPostingOptions:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: [string, 'null']
                description: Send it as post.skool.group.
              slug:
                type: [string, 'null']
              name:
                type: [string, 'null']
        labels:
          type: [array, 'null']
          items:
            type: object
            properties:
              id:
                type: [string, 'null']
              name:
                type: [string, 'null']
        labels_for_group:
          type: [string, 'null']

    YouTubePostingOptions:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        privacy_status_options:
          type: array
          items:
            type: string
        tags_max_characters:
          type: integer

    PostList:
      type: object
      required: [data, next_cursor, next_url]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/PostItem'
              - $ref: '#/components/schemas/ScheduledPostItem'
        next_cursor:
          type: [string, 'null']
        next_url:
          type: [string, 'null']
          format: uri
          description: The next page with the same filters; null on the last page.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'

    PostItem:
      type: object
      required: [id, kind, profile_id, platform, status, done, media_type, publish_id, permalink, error_message, at, updated_at, scheduled_post_id, notices]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [post]
        profile_id:
          type: [string, 'null']
        platform:
          type: string
        status:
          type: string
          x-known-values: [success, failed, processing, timeout]
          description: timeout = sent, never confirmed; do not send it again.
        done:
          type: boolean
          description: True once it will not change by itself.
        media_type:
          type: [string, 'null']
        publish_id:
          type: [string, 'null']
          description: The network's own id.
        permalink:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
          maxLength: 1000
        at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        scheduled_post_id:
          type: [string, 'null']
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: >-
            What we changed to get a TikTok photo post out, as it was said when TikTok took the post:
            a photo sent as a smaller copy (resized_for_tiktok, for a photo larger than 1080 x 1920)
            or as a JPEG copy (converted_to_jpeg), a title or description shortened or made from part
            of the text (title_shortened, description_shortened, text_partly_used). Each entry has
            code and message and, for a photo, photo (for a smaller copy also photos, size and
            copy_size); the answer's from and field are not kept. Kept also when the post went out
            through a schedule. On any network, moved_to_next_day: another network of the same
            scheduled post did not fit the day's allowance (the day filled up while the post was going
            out) and moved to the same time on the next day as a scheduled post of its own, which
            scheduled_post_id names, with the networks in platforms; do not send them again. Empty when
            there is none; on every other network nothing else: there, what we changed (a YouTube title or
            description we shortened, for example) is said only in the warnings of the answer that
            sent or scheduled the post. See https://status200uploads.com/docs/api#tiktok-photos.

    ScheduledPostItem:
      type: object
      required: [id, kind, profile_id, platforms, status, outcome, done, media_type, at, scheduled_for, created_at, updated_at, note, error_message]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [scheduled_post]
        profile_id:
          type: [string, 'null']
        platforms:
          type: array
          items:
            type: string
        status:
          type: string
          x-known-values: [scheduled, processing, published, failed, cancelled]
        outcome:
          type: string
          x-known-values: [waiting, cancelled, sending, success, failed, partly_failed, unconfirmed]
          description: >-
            What became of it, read from each network's result. partly_failed: some networks went out
            and some failed or were not sent (see results). A network that did not fit the day's
            allowance because the day filled up while the post was going out is not one of them: it
            left platforms for a scheduled post of its own at the same time on the next day (waiting),
            so this post reads as what went out (success when the rest did), and each result that went
            out carries a moved_to_next_day notice whose scheduled_post_id names that post.
        done:
          type: boolean
        media_type:
          type: [string, 'null']
        at:
          type: [string, 'null']
          format: date-time
        scheduled_for:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']
          description: While it waits, why it moved (for example a used-up daily allowance). Not an error.
        error_message:
          type: [string, 'null']
          maxLength: 1000

    ScheduledResult:
      type: object
      required: [platform, post_id, status, done, publish_id, permalink, error_message, notices]
      properties:
        platform:
          type: string
        post_id:
          type: [string, 'null']
          description: That network's History id, when there is one.
        status:
          type: string
          x-known-values: [success, failed, processing, timeout, pending, not_sent]
        done:
          type: boolean
        publish_id:
          type: [string, 'null']
        permalink:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
          maxLength: 1000
          description: Why it failed or was not sent.
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: >-
            That network's post's notices (see PostItem): what we changed to get a TikTok photo post
            out, for example a photo sent as a smaller copy, and moved_to_next_day on any network
            (another network of this scheduled post moved to the next day as a scheduled post of its
            own). Empty on the other networks when nothing moved, and while there is no post (pending,
            not_sent).

    Figures:
      type: object
      required: [metrics, not_reported, engagement, polled_at, note]
      properties:
        metrics:
          type: object
          required: [views, likes, comments, shares, impressions, reach, saves, clicks, watch_time_seconds]
          properties:
            views:
              type: [number, 'null']
            likes:
              type: [number, 'null']
            comments:
              type: [number, 'null']
            shares:
              type: [number, 'null']
            impressions:
              type: [number, 'null']
            reach:
              type: [number, 'null']
            saves:
              type: [number, 'null']
            clicks:
              type: [number, 'null']
            watch_time_seconds:
              type: [number, 'null']
          description: A figure the network reported, or null. Null never means zero.
        not_reported:
          type: array
          items:
            type: string
        engagement:
          type: [number, 'null']
        polled_at:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']

    PostRead:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/PostItem'
                - type: object
                  required: [figures]
                  properties:
                    figures:
                      oneOf:
                        - type: 'null'
                        - $ref: '#/components/schemas/Figures'
                      description: null unless the post succeeded.
            - allOf:
                - $ref: '#/components/schemas/ScheduledPostItem'
                - type: object
                  required: [results]
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/ScheduledResult'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'

    MediaImportRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: >-
            A public http or https URL (port 80 or 443) of the image or video file itself: JPEG, PNG,
            WebP, MP4 (M4V too), MOV or WebM. A web page that shows it, or a file of another type
            (GIF, HEIC, SVG ...), is 415.
      example:
        url: https://example.com/video.mp4

    MediaImportReady:
      type: object
      required: [success, file_id, size, type, status]
      properties:
        success:
          type: boolean
        file_id:
          type: string
          format: uuid
          description: Send it in post.content.mediaID.
        size:
          type: [integer, 'null']
        type:
          type: string
        status:
          type: string
          x-known-values: [ready]
      example:
        success: true
        file_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        size: 2048576
        type: image/jpeg
        status: ready

    MediaImportStarted:
      type: object
      required: [success, file_id, status, message, size, type]
      properties:
        success:
          type: boolean
        file_id:
          type: string
          format: uuid
        status:
          type: string
          x-known-values: [processing]
        message:
          type: string
        size:
          type: [integer, 'null']
        type:
          type: string

    MediaStatus:
      type: object
      required: [success, file_id, status, size, type, error]
      properties:
        success:
          type: boolean
          description: true only when status is ready.
        file_id:
          type: string
          format: uuid
        status:
          type: string
          x-known-values: [processing, ready, failed, uploading, verifying]
          description: >-
            processing, ready or failed: a file in the media library. uploading (not all of the file
            has arrived; run the uploader again, or get a fresh token) and verifying (it arrived and
            is being checked): an upload link's file before it is in the library. Its failed has the
            reason in error.
        size:
          type: [integer, 'null']
        type:
          type: [string, 'null']
        public_url:
          type: [string, 'null']
          description: The file's public address in the media library. Not sent for an upload link's file that is not in the library yet.
        error:
          type: [string, 'null']
          description: The import's (or the upload's) failure reason when status is failed. Not an error of this request.
        bytes_uploaded:
          type: integer
          description: Present when the size of a URL import is known.
        progress:
          type: integer
          minimum: 0
          maximum: 100

    MediaError:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
              description: The sentence (the older shape of this endpoint).
            - $ref: '#/components/schemas/ImportBudgetError'
        code:
          type: string
          description: >-
            On the 429 (rate_limited), the Idempotency-Key answers, and a refused share link (its
            400 code, 403 plan_limit_reached, 503 uploads_busy).
        provider:
          type: string
          x-known-values: [google_drive, dropbox, onedrive, sharepoint, google_photos, icloud, claude_ai]
          description: A refused share link's source. Next to it, next_step says what fixes it.
        upgrade_url:
          type: string
          format: uri
          description: 403 plan_limit_reached of a share link - where the paid plans are.
        file_name:
          type: string
          description: 415 of a share link - the shared file's name, when the provider sent it.
        retry_after_seconds:
          type: integer
        size:
          type: [integer, 'null']
          description: 413 - the declared size.
        file_id:
          type: string
          description: 413 when the storage refused the file after the import started.
        status:
          type: string
          x-known-values: [failed]
        started_at:
          type: string
        first_used_at:
          type: string

    ImportBudgetError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          x-known-values: [import_budget_exhausted]
        message:
          type: string
        used_bytes:
          type: integer
        limit_bytes:
          type: [integer, 'null']
        remaining_bytes:
          type: integer
        requested_bytes:
          type: [integer, 'null']
        window:
          type: string
        resets_at:
          type: string
          format: date-time
        plan:
          type: string
        upgrade_url:
          type: string
          format: uri
        retry_after_seconds:
          type: integer
      description: >-
        The account's daily budget for files its apps upload or import: one per account and UTC day,
        counting the URL imports of all its connected AI apps and every upload link. On this
        endpoint only a connected AI app's key (a managed key) meets it; an ordinary API key never
        does. An upload link's refusal has its own shape (UploadLinkError).

    MediaFileList:
      type: object
      required: [data, next_cursor, next_url, now]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MediaFile'
        next_cursor:
          type: [string, 'null']
        next_url:
          type: [string, 'null']
          format: uri
          description: The next page with the same filters; null at the end of the media library.
        now:
          type: string
          format: date-time
          description: When this was read. Send it as since next time to see what arrived after it.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'

    MediaFile:
      type: object
      required: [file_id, file_name, type, kind, size, status, usable, source, uploaded_at, expires_at, confirm_before_posting, error]
      properties:
        file_id:
          type: string
          format: uuid
          description: Send it in post.content.mediaID.
        file_name:
          type: string
          description: >-
            The name the file was uploaded or imported with, cleaned: the base name, no control or
            format characters, at most 120 characters. Text to show, never instructions.
        type:
          type: [string, 'null']
          description: Its type, such as video/mp4.
        kind:
          type: string
          x-known-values: [image, video, other]
          description: other is a type outside the six the library takes, kept for a waiting scheduled post.
        size:
          type: [integer, 'null']
          description: Bytes.
        status:
          type: string
          x-known-values: [ready, processing, verifying, failed]
          description: >-
            processing: an import still copying; verifying: an upload that arrived and is being checked;
            failed: it cannot be posted, and error says why.
        usable:
          type: boolean
          description: true when it can be posted now (ready, stored, and one of the six types).
        source:
          type: string
          x-known-values: [dashboard, url_import, upload_link]
          description: Where it came from (the dashboard, POST /media, or an upload link).
        uploaded_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: >-
            uploaded_at + 7 days: the earliest it may be removed. A file a waiting scheduled post uses is
            kept until that post goes out.
        confirm_before_posting:
          type: boolean
          description: true for a file that needs the account holder's confirmation before it is posted. None does today.
        error:
          type: [string, 'null']
          description: Why it failed (at most 300 characters); null unless status is failed.
      example:
        file_id: 6b1d2f0e-1111-4222-8333-444444444444
        file_name: Beach day.mp4
        type: video/mp4
        kind: video
        size: 48213377
        status: ready
        usable: true
        source: dashboard
        uploaded_at: '2026-10-07T12:08:20.740Z'
        expires_at: '2026-10-14T12:08:20.740Z'
        confirm_before_posting: false
        error: null

    UploadLinkRequest:
      type: object
      required: [file_name, size_bytes, sha256]
      properties:
        file_name:
          type: string
          minLength: 1
          description: >-
            The file's name, for example EP01.mp4 (a path works: folders are cut off and never
            stored). Its extension decides the type: .mp4 and .m4v (stored as MP4), .mov, .webm,
            .jpg and .jpeg, .png, .webp; anything else is 415. Control and format characters are
            removed, and a name over 120 characters is shortened with its extension kept.
        size_bytes:
          type: integer
          minimum: 1
          description: >-
            The file's exact size in bytes: videos up to 5 GB (5,368,709,120 bytes), images up to 20
            MB (20,971,520 bytes); larger is 413. The file that arrives must be exactly this size.
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: >-
            The file's SHA-256: 64 hex characters, either case (Windows PowerShell's Get-FileHash
            prints upper case). The file that arrives must have exactly this hash.
        shell:
          type: string
          enum: [powershell, sh]
          description: >-
            For a ready-made command in the answer (uploader.command): powershell for Windows
            PowerShell, sh for sh, bash or zsh (macOS, Linux, WSL and Git Bash). Without it the
            answer has no uploader block: send the file with your own TUS client.
        runner:
          type: string
          enum: [native, node]
          default: native
          description: native runs our PowerShell or sh uploader; node runs our Node.js uploader (Node.js 18 or newer).
        max_run_seconds:
          type: integer
          minimum: 30
          maximum: 7000
          default: 100
          description: >-
            How long one run of the uploader may take; it always ends within that plus 10 seconds,
            so give the command a timeout at least 60 seconds longer. A run that used its time ends
            with exit 3 (partial), and the same command continues where it stopped.
      description: >-
        file_id is not part of a new link (400): a fresh token for an unfinished upload is POST
        /media/uploads/{file_id}/token. Other fields are not read.

    UploadTokenRequest:
      type: object
      properties:
        shell:
          type: string
          enum: [powershell, sh]
          description: As for a new link; with it the answer carries a new uploader.command.
        runner:
          type: string
          enum: [native, node]
          default: native
        max_run_seconds:
          type: integer
          minimum: 30
          maximum: 7000
          default: 100
      description: Optional. The file's name, size and SHA-256 are the link's own and are not sent again.

    UploadLink:
      type: object
      required: [success, file_id, status, file_name, size, type, sha256, renewed, upload]
      properties:
        success:
          type: boolean
        file_id:
          type: string
          format: uuid
          description: The id of this upload, and of the file in the media library once it is ready (send it in post.content.mediaID).
        status:
          type: string
          x-known-values: [uploading]
        file_name:
          type: string
          description: The name that is kept (folders and control characters removed, at most 120 characters).
        size:
          type: integer
        type:
          type: string
          x-known-values: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm]
          description: Decided by the extension (an .m4v file is video/mp4).
        sha256:
          type: string
          description: Lower case.
        renewed:
          type: boolean
          description: true for a fresh token for the same address (POST /media/uploads/{file_id}/token, or the same file asked for again from the same key).
        upload:
          type: object
          required: [protocol, url, token, chunk_size, token_expires_at, upload_expires_at, resume_before]
          properties:
            protocol:
              type: string
              x-known-values: [tus-1.0.0]
            url:
              type: string
              format: uri
              description: >-
                The TUS upload address, on storage's own host (yglvofckrdutesfzxwyb.storage.supabase.co).
                It names a private staging place, never the file_id or the file's public address.
            token:
              type: string
              description: >-
                The signed upload token: send it as the x-signature header of every request to
                upload.url, never in a URL. It works for this one file only, for about 2 hours. Keep
                it out of logs and chat messages.
            chunk_size:
              type: integer
              description: Every PATCH but the last carries exactly this many bytes (6,291,456).
            token_expires_at:
              type: [string, 'null']
              format: date-time
            upload_expires_at:
              type: [string, 'null']
              format: date-time
              description: When storage drops the unfinished upload (about 24 hours after the link was made).
            resume_before:
              type: [string, 'null']
              format: date-time
              description: >-
                Until when a stopped upload can be continued (with a fresh token once this one
                expired): 2 hours after the newest token expires, at most 24 hours after the link
                was made. After it, what was sent is deleted.
        uploader:
          type: object
          required: [shell, runner, version, download_url, sha256, max_run_seconds, command]
          description: Only when shell was sent.
          properties:
            shell:
              type: string
              x-known-values: [powershell, sh]
            runner:
              type: string
              x-known-values: [native, node]
            version:
              type: string
              examples: [v1]
              description: The uploader version. A published version never changes; a new uploader is a new version.
            download_url:
              type: string
              format: uri
              description: Where the command downloads the uploader from (served as text/plain).
            sha256:
              type: string
              description: The SHA-256 of that file. The command refuses to run a download with any other.
            max_run_seconds:
              type: integer
            command:
              type: string
              description: >-
                Run it as it is in that shell (never inside another shell), with <PATH> in its
                S200_FILE line replaced by the file's full path, and with a timeout of at least
                max_run_seconds + 60 seconds. It downloads the uploader into a fresh folder, checks
                its SHA-256, sends the file and removes the folder. Its exit code is the uploader's:
                0 done, 1 failed, 2 refused, 3 partial, 4 token_rejected, 5 busy, 6 bad_command. It
                also ends with 1, with a message and no JSON line, when it stops before the uploader
                runs: the download failed (run it once more), the download's SHA-256 did not match
                (stop), or Node.js or Windows PowerShell is missing (ask again with the runner or
                shell its message names).
      description: >-
        The answer also carries next_step: how to run the command (or send the file), the timeout,
        and what to call when it ends.

    UploadReady:
      type: object
      required: [success, file_id, status, file_name, size, type, sha256, message]
      properties:
        success:
          type: boolean
        file_id:
          type: string
          format: uuid
          description: Send it in post.content.mediaID.
        status:
          type: string
          x-known-values: [ready]
        file_name:
          type: string
        size:
          type: integer
        type:
          type: string
        sha256:
          type: string
        message:
          type: string
      example:
        success: true
        file_id: 6b1d2f0e-3c4a-4b5d-8e6f-7a8b9c0d1e2f
        status: ready
        file_name: EP01.mp4
        size: 295698432
        type: video/mp4
        sha256: 9f2c4b6a8e0d1c3b5a7f9e1d3c5b7a9f0e2d4c6b8a0f1e3d5c7b9a1f3e5d7c9b
        message: EP01.mp4 arrived complete (295,698,432 bytes, SHA-256 matches). Publish it with this file_id.

    UploadVerifying:
      type: object
      required: [success, file_id, status, file_name, size, type, sha256, message, retry_after_seconds]
      properties:
        success:
          type: boolean
        file_id:
          type: string
          format: uuid
        status:
          type: string
          x-known-values: [verifying]
        file_name:
          type: string
        size:
          type: integer
        type:
          type: string
        sha256:
          type: string
        message:
          type: string
        retry_after_seconds:
          type: integer
          description: The same seconds as Retry-After. 15, or longer when a temporary problem on our side delayed the check (it retries on its own).

    UploadCancelled:
      type: object
      required: [success, file_id, status, message]
      properties:
        success:
          type: boolean
        file_id:
          type: string
          format: uuid
        status:
          type: string
          x-known-values: [cancelled]
        message:
          type: string
      example:
        success: true
        file_id: 6b1d2f0e-3c4a-4b5d-8e6f-7a8b9c0d1e2f
        status: cancelled
        message: The upload was cancelled. Anything that arrived is deleted within a few minutes.

    UploadLinkError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Branch on this. Each response lists its codes in x-error-codes; new codes are added without notice.
        message:
          type: string
          description: A sentence for a person, saying what happened.
        file_id:
          type: string
          format: uuid
        reason:
          type: [string, 'null']
          x-known-values: [sha256, size, type, content, replaced, conflict, gone, unverifiable]
          description: >-
            upload_rejected and upload_failed - why. sha256 or size: the file that arrived is not
            the one measured (measure it again, and do not upload it again when the values are the
            same). type or content: it is not really a file of its type (renaming does not change
            that). replaced, conflict or gone: make a new link. unverifiable (upload_failed): it
            could not be checked within 24 hours because of a problem on our side.
        retry_after_seconds:
          type: integer
          description: Seconds to wait before the same request can succeed; the Retry-After header says the same when it is an hour or less.
        plan:
          type: string
        upgrade_url:
          type: string
          format: uri
        open:
          type: integer
        limit:
          type: integer
        window:
          type: string
          x-known-values: [10 minutes, day]
        resets_at:
          type: [string, 'null']
          format: date-time
        used_bytes:
          type: integer
        limit_bytes:
          type: integer
        remaining_bytes:
          type: integer
        requested_bytes:
          type: integer
        held_bytes:
          type: integer
          description: >-
            import_budget_exhausted - the bytes of today's budget held by unfinished upload links of
            this account whose file has not fully arrived (only when there are any).
        held_until:
          type: string
          format: date-time
          description: >-
            import_budget_exhausted - when those links free their bytes if nobody continues them
            (only when that is before resets_at).
        size_bytes:
          type: integer
        max_bytes:
          type: integer
      x-status200-required-by-code:
        media_too_large: [size_bytes, max_bytes]
        plan_limit_reached: [plan, upgrade_url]
        import_budget_exhausted: [used_bytes, limit_bytes, remaining_bytes, requested_bytes, window, resets_at, plan, upgrade_url]
        too_many_open_uploads: [open, limit, retry_after_seconds]
        rate_limited: [limit, retry_after_seconds]
        uploads_busy: [retry_after_seconds]
        upload_already_received: [file_id]
        upload_incomplete: [file_id]
        upload_rejected: [file_id, reason]
        upload_failed: [file_id, reason]
        upload_expired: [file_id]
        upload_being_checked: [file_id, retry_after_seconds]
      description: >-
        The refusals of the upload-link endpoints. Besides the fields here they carry next_step (what
        to do next, in a sentence) and, for most codes, retry: "never" (the same request cannot
        succeed now) or "after_reset" (a budget that frees at 00:00 UTC). The AI connector reads the
        same answers; what a client may send again is components.x-status200-retry.

    UploadLinkErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/UploadLinkError'

  x-status200-retry:
    version: 1
    rules:
      wait_and_resend: >-
        Nothing was sent, or the first answer comes back: wait Retry-After (else
        error.retry_after_seconds or retry_after_seconds, else 5 seconds), then send the IDENTICAL
        request again (the same body and the same Idempotency-Key). Cap the tries and the total wait.
      resend_once_with_key: >-
        The outcome may not be known. Send the identical request once more ONLY when it carried an
        Idempotency-Key (an answer we kept is replayed; a failure the network reported is sent afresh,
        as History's Retry would). Without a key, check History (GET /posts) instead.
      never: >-
        The same request cannot succeed now, so do not resend it as it is. Change it, wait for
        resets_at, or first do what the answer's next_step says where it has one (upload_incomplete:
        send the rest of the file, then ask complete again).
      not_a_failure: Accepted. It goes out on its own; do not send it again.
    # Read first, for that operation only, then by_code: an answer whose rule is not its code's. Here the
    # paused check of completeUpload (503 upload_links_paused): the file that arrived is kept, so it is asked
    # again after Retry-After. A client that does not read this gives up there instead; nothing is sent twice.
    by_operation:
      completeUpload:
        upload_links_paused: wait_and_resend
    by_code:
      media_processing: wait_and_resend
      idempotency_in_progress: wait_and_resend
      rate_limited: wait_and_resend
      caller_check_unavailable: wait_and_resend
      schedule_check_unavailable: wait_and_resend
      idempotency_unavailable: wait_and_resend
      dry_run_unavailable: wait_and_resend
      upstream_unavailable: wait_and_resend
      cancel_unconfirmed: wait_and_resend
      skool_unavailable: wait_and_resend
      x_unavailable: wait_and_resend
      platform_error: resend_once_with_key
      server_error: resend_once_with_key
      upload_worker_failed: resend_once_with_key
      no_publish_id: resend_once_with_key
      idempotency_outcome_unknown: never
      idempotency_key_reused: never
      monthly_limit_reached: never
      daily_limit_reached: never
      daily_attempts_exceeded: never
      x_limit_reached: never
      x_link_limit_reached: never
      import_budget_exhausted: never
      scheduled: not_a_failure
      queued_for_next_day: not_a_failure
      still_publishing: not_a_failure
      schedule_unconfirmed: not_a_failure
      too_many_open_uploads: wait_and_resend
      uploads_busy: wait_and_resend
      upload_being_checked: wait_and_resend
      invalid_request: never
      unsupported_media_type: never
      media_too_large: never
      plan_limit_reached: never
      account_being_deleted: never
      upload_links_paused: never
      upload_already_received: never
      upload_closed: never
      renewals_exhausted: never
      upload_incomplete: never
      upload_rejected: never
      upload_failed: never
      upload_expired: never
    by_status:
      2xx: not_a_failure
      4xx: never
      5xx: resend_once_with_key
      not_json: resend_once_with_key

  x-status200-limits:
    idempotency_key_max_length: 255
    idempotency_ttl_hours: 24
    idempotency_retry_after_seconds: 5
    idempotency_stale_minutes: 10
    reads_per_minute: 60
    options_per_minute: 10
    list_page_default: 20
    list_page_max: 100
    max_schedule_ahead_days: 365
    schedule_now_within_seconds: 60
    max_waiting_scheduled: 500
    post_throttle_seconds: 20
    media_throttle_seconds: 20
    retry_after_header_max_seconds: 3600
    media_processing_retry_after_seconds: 30
    v2_media_wait_seconds: 12
    older_media_wait_seconds: 90
    v2_answer_within_seconds: 24
    media_answer_within_seconds: 22
    media_probe_timeout_seconds: 8
    image_import_max_mb: 20
    video_import_max_gb: 5
    media_kept_days: 7
    upload_link_max_bytes: 5368709120
    upload_link_image_max_bytes: 20971520
    upload_chunk_bytes: 6291456
    upload_open_per_account: 10
    upload_links_per_10_minutes: 20
    upload_links_per_day: 100
    upload_calls_per_minute: 60
    upload_token_renewals: 12
    upload_link_max_hours: 24
    upload_resume_hours_after_token: 2
    upload_answer_within_seconds: 22
    upload_verifying_retry_after_seconds: 15
    upload_run_seconds_default: 100
    upload_run_seconds_min: 30
    upload_run_seconds_max: 7000
