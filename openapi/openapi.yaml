            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '500':
          $ref: '#/components/responses/UploadServerError'
        '503':
          description: upload_links_paused - making links and tokens is paused for maintenance, or uploading from a computer is switched off for this one account (the message says "switched off for this account"; asking again does not help, upload the file in the dashboard, Media, or write to info@status200uploads.com). uploads_busy - the limiter could not answer (Retry-After 30).
          x-error-codes: [upload_links_paused, uploads_busy]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
