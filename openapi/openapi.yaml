                    sha256: 9f2c4b6a8e0d1c3b5a7f9e1d3c5b7a9f0e2d4c6b8a0f1e3d5c7b9a1f3e5d7c9b
                    renewed: false
                    upload:
                      protocol: tus-1.0.0
                      url: https://yglvofckrdutesfzxwyb.storage.supabase.co/storage/v1/upload/resumable/sign/bWVkaWEtdXBsb2Fkcy84ZjE0ZTQ1Zi1jZWVhLTQ2N2EtOWEzNi0xZDViMGUzYTdjMjEvMGU5ZDhjN2ItNmE1Zi00ZTNkLTljMmItMWEwZjllOGQ3YzZiLm1wNC80ZjNlMmQxYy0wYjlhLTQ4NzYtOTU0My0yMTBmZWRjYmE5ODc
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJvd25lciI6IjhmMTRlNDVmLWNlZWEtNDY3YS05YTM2LTFkNWIwZTNhN2MyMSIsInVybCI6Im1lZGlhLXVwbG9hZHMvOGYxNGU0NWYtY2VlYS00NjdhLTlhMzYtMWQ1YjBlM2E3YzIxLzBlOWQ4YzdiLTZhNWYtNGUzZC05YzJiLTFhMGY5ZThkN2M2Yi5tcDQiLCJ1cHNlcnQiOmZhbHNlLCJpYXQiOjE3OTEyODgwMDAsImV4cCI6MTc5MTI5NTIwMH0.Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-Qx9_-
