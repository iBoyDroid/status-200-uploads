  /media/uploads/{file_id}/complete:
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/UploadMethodNotAllowed'
      note: Any method but POST (Allow POST, OPTIONS), answered after the key is checked (without a valid key, 401).
    parameters:
      - $ref: '#/components/parameters/UploadFileId'
    post:
      operationId: completeUpload
      tags: [Media]
      summary: Check an uploaded file and put it in the media library
      description: >-
        Call it once the whole file was sent (the uploader exited 0). The file that arrived is
        checked: its exact size, its type and first bytes, and its SHA-256. 200 ready: it is in the
        media library; publish it with this file_id in post.content.mediaID. 202 verifying: the
        check is still running (a 5 GB file can take about 15 minutes); poll GET /media?file_id=
        every 15 seconds until it says ready, and never upload the file again: it finishes on its
        own. A check delayed by a temporary problem on our side answers 202 with a longer
        Retry-After and retries by itself. No body. Any API key of the account may call it, and
        calling it again is harmless (a ready upload answers 200 again).
      responses:
        '200':
          description: Ready. The file is in the media library, kept 7 days like every library file (and until a scheduled post that uses it goes out).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReady'
        '202':
          description: Verifying. Poll GET /media?file_id= after Retry-After (also retry_after_seconds) until it is ready; do not upload the file again.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVerifying'
        '400':
          description: invalid_request - the file_id is not a UUID.
          x-error-codes: [invalid_request]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '401':
          $ref: '#/components/responses/UploadUnauthorized'
        '403':
          description: account_being_deleted - nothing is checked for an account that is being deleted.
          x-error-codes: [account_being_deleted]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '404':
          description: media_not_found - no upload with this id on your account.
          x-error-codes: [media_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '409':
          description: >-
            upload_incomplete: storage has not received the whole file yet; run the uploader again
            (it continues where it stopped), then call this again. If it comes twice right after the
            uploader exited 0, stop: cancel the upload and make a new link. upload_closed: the upload
            was cancelled.
          x-error-codes: [upload_incomplete, upload_closed]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '410':
          description: >-
            upload_expired: the upload was not finished within 24 hours, or not continued in time,
            and was removed; or a ready file has since left the media library (deleted, or older than
            7 days). Make a new link.
          x-error-codes: [upload_expired]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '422':
          description: >-
            upload_rejected: the file that arrived is not the one that was announced, and it was
            deleted (error.reason sha256 or size: measure the file again and make a new link with the
            new values, and do not upload it again when they are the same; type or content: it is not
            really a file of its type, convert it; replaced, conflict or gone: make a new link).
            upload_failed: it could not be checked within 24 hours because of a problem on our side
            (error.reason unverifiable); we were alerted. Make a new link.
          x-error-codes: [upload_rejected, upload_failed]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '429':
          description: rate_limited - 60 upload-link calls this minute (Retry-After).
          x-error-codes: [rate_limited]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        '500':
          $ref: '#/components/responses/UploadServerError'
        '503':
          description: >-
            upload_links_paused: checking uploaded files is paused for maintenance; what arrived is
            kept (Retry-After 600, no retry promise): ask again after Retry-After, and do not upload
            the file again (the one answer whose rule is in x-status200-retry.by_operation:
            wait_and_resend). uploads_busy: the limiter could not answer (Retry-After 30).
          x-error-codes: [upload_links_paused, uploads_busy]
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLinkErrorResponse'
        default:
          $ref: '#/components/responses/UploadDefault'

  /media/uploads/{file_id}:
    x-status200-other-methods:
      status: 405
      code: method_not_allowed
      response: '#/components/responses/UploadMethodNotAllowed'
      note: Any method but DELETE (Allow DELETE, OPTIONS), answered after the key is checked (without a valid key, 401). The status of an upload is GET /media?file_id=.
    parameters:
